    <style>
        /* 小说管理页面特有样式 */
        .admin-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .filter-group select,
        .filter-group input {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            font-size: 0.875rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding-left: 2.5rem;
        }

        .search-box svg {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
        }

        /* 数据表格 */
        .data-card {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-xl);
            border: 1px solid var(--color-border);
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--color-border);
        }

        .data-table th {
            font-weight: 600;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            background: var(--color-bg-secondary);
        }

        .data-table tbody tr:hover {
            background: var(--color-bg-tertiary);
        }

        .novel-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .novel-cover {
            width: 48px;
            height: 64px;
            border-radius: var(--radius-md);
            object-fit: cover;
        }

        .novel-title {
            font-weight: 500;
            color: var(--color-text-primary);
        }

        .novel-author {
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-badge.published {
            background: var(--color-success-bg);
            color: var(--color-success);
        }

        .status-badge.draft {
            background: var(--color-warning-bg);
            color: var(--color-warning);
        }

        .status-badge.suspended {
            background: var(--color-error-bg);
            color: var(--color-error);
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
        }

        .btn-icon-sm {
            padding: 0.375rem;
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: all var(--duration-fast);
        }

        .btn-icon-sm:hover {
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
        }

        .btn-icon-sm svg {
            width: 16px;
            height: 16px;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--color-border);
        }

        .pagination-info {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .pagination-btns {
            display: flex;
            gap: 0.5rem;
        }

        .page-btn {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .page-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            border: 1px solid var(--color-border);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        /* 主题切换按钮样式 */
        .admin-theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            color: var(--color-text-secondary);
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .admin-theme-toggle:hover {
            color: var(--color-text-primary);
            background-color: var(--color-bg-tertiary);
        }

        .admin-theme-toggle svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        .icon-sun,
        .icon-moon {
            display: none;
        }

        .theme-light .icon-sun,
        .theme-paper .icon-sun {
            display: block;
        }

        .theme-dark .icon-moon,
        .theme-eye-care .icon-moon {
            display: block;
        }

        @media (max-width: 1024px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                display: none;
            }

            .admin-main {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>

    <!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->
    <script src="../../assets/js/fixes/index.js"></script>
    
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderNovelTable();
            bindEvents();
        });

        // 渲染小说表格
        function renderNovelTable() {
            const tbody = document.getElementById('novelTableBody');
            
            // 使用Mock数据
            let novels = [];
            if (window.MockData && window.MockData.NOVELS) {
                novels = window.MockData.NOVELS.slice(0, 10);
            }

            if (novels.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 3rem;">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = novels.map(novel => {
                const statusClass = novel.status === 'published' ? 'published' : 
                                   novel.status === 'draft' ? 'draft' : 'suspended';
                const statusText = novel.status === 'published' ? '已发布' : 
                                  novel.status === 'draft' ? '草稿' : '已下架';
                
                return `
                    <tr>
                        <td>
                            <div class="novel-info">
                                <img src="${novel.cover || 'https://picsum.photos/200/267'}" alt="${novel.title}" class="novel-cover">
                                <div>
                                    <div class="novel-title">${novel.title}</div>
                                    <div class="novel-author">${novel.author || '未知作者'}</div>
                                </div>
                            </div>
                        </td>
                        <td>${novel.category || '未分类'}</td>
                        <td>${novel.chapter_count || 0}</td>
                        <td>${formatNumber(novel.view_count || 0)}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${formatDate(novel.updated_at)}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-icon-sm" title="编辑">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                </button>
                                <button class="btn-icon-sm" title="查看">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                                <button class="btn-icon-sm" title="删除">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 绑定事件
        function bindEvents() {
            // 搜索
            document.getElementById('searchInput').addEventListener('input', debounce(function() {
                renderNovelTable();
            }, 300));

            // 筛选
            document.getElementById('statusFilter').addEventListener('change', renderNovelTable);
            document.getElementById('categoryFilter').addEventListener('change', renderNovelTable);
            document.getElementById('sortFilter').addEventListener('change', renderNovelTable);
        }

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 格式化数字
        function formatNumber(num) {
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + 'w';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'k';
            }
            return num.toString();
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN');
        }
    </script>
