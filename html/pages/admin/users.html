    <style>
        /* 用户页面特有样式 */
        .user-info { display: flex; align-items: center; gap: 0.75rem; }
        .user-avatar { width: 40px; height: 40px; border-radius: var(--radius-full); object-fit: cover; }
        .user-name { font-weight: 500; color: var(--color-text-primary); }
        .user-email { font-size: 0.75rem; color: var(--color-text-muted); }
        .role-badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 500; }
        .role-badge.admin { background: var(--color-error-bg); color: var(--color-error); }
        .role-badge.user { background: var(--color-primary-bg); color: var(--color-primary); }
        .role-badge.author { background: var(--color-success-bg); color: var(--color-success); }
        .status-badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 500; }
        .status-badge.active { background: var(--color-success-bg); color: var(--color-success); }
        .status-badge.banned { background: var(--color-error-bg); color: var(--color-error); }
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>

                    <a href="comments.html" class="nav-item">

        <main class="admin-main">
            <div class="admin-header">
                <h1 class="admin-title">用户列表</h1>
                <div class="admin-actions">
                    <button class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        新增用户
                    </button>
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="搜索用户名、邮箱...">
                </div>
                <div class="filter-group">
                    <label>角色</label>
                    <select id="roleFilter"><option value="">全部</option><option value="user">普通用户</option><option value="author">作者</option><option value="admin">管理员</option></select>
                </div>
                <div class="filter-group">
                    <label>状态</label>
                    <select id="statusFilter"><option value="">全部</option><option value="active">正常</option><option value="banned">已封禁</option></select>
                </div>
            </div>

            <div class="data-card">
                <table class="data-table">
                    <thead>
                        <tr><th>用户信息</th><th>角色</th><th>注册时间</th><th>最后登录</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
                <div class="pagination">
                    <div class="pagination-info">显示 1-10 条，共 15,234 条</div>
                    <div class="pagination-btns">
                        <button class="page-btn" disabled>上一页</button>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                        <button class="page-btn">3</button>
                        <span>...</span>
                        <button class="page-btn">1524</button>
                        <button class="page-btn">下一页</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/js/mock/data-global.js"></script>
    
    <!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->
    <script src="../../assets/js/fixes/index.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderUserTable();
            bindEvents();
        });

        function renderUserTable() {
            const tbody = document.getElementById('userTableBody');
            let users = [];
            if (window.MockData && window.MockData.USERS) {
                users = window.MockData.USERS.slice(0, 10);
            }

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 3rem;">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => {
                const roleClass = user.role === 'admin' ? 'admin' : user.role === 'author' ? 'author' : 'user';
                const roleText = user.role === 'admin' ? '管理员' : user.role === 'author' ? '作者' : '普通用户';
                return `
                    <tr>
                        <td>
                            <div class="user-info">
                                <img src="${user.avatar_url || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + user.id}" alt="${user.username}" class="user-avatar">
                                <div>
                                    <div class="user-name">${user.username}</div>
                                    <div class="user-email">${user.email}</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="role-badge ${roleClass}">${roleText}</span></td>
                        <td>${new Date(user.created_at).toLocaleDateString('zh-CN')}</td>
                        <td>${new Date(user.last_login).toLocaleDateString('zh-CN')}</td>
                        <td><span class="status-badge active">正常</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-icon-sm" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                                <button class="btn-icon-sm" title="封禁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg></button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function bindEvents() {
            document.getElementById('searchInput').addEventListener('input', debounce(renderUserTable, 300));
            document.getElementById('roleFilter').addEventListener('change', renderUserTable);
            document.getElementById('statusFilter').addEventListener('change', renderUserTable);
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
