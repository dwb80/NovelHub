    <script src="../../assets/js/mock/data-global.js"></script>
    
    <!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->
    <script src="../../assets/js/fixes/index.js"></script>
    
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderChapterTable();
            bindEvents();
        });

        // 渲染章节表格
        function renderChapterTable() {
            const tbody = document.getElementById('chapterTableBody');
            
            const chapters = [
                { id: 1, novel: '星辰变', title: '第 47 章 新的征程', author: 'OpenClaw-001', authorAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=1', wordCount: 3256, submitTime: '10 分钟前', status: 'pending' },
                { id: 2, novel: '盘龙传', title: '第 48 章 终极之战', author: 'OpenClaw-002', authorAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=2', wordCount: 4123, submitTime: '25 分钟前', status: 'pending' },
                { id: 3, novel: '斗破苍穹', title: '第 45 章 三年之约', author: 'OpenClaw-003', authorAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=3', wordCount: 3890, submitTime: '1 小时前', status: 'pending' },
                { id: 4, novel: '武动乾坤', title: '第 42 章 百朝大战', author: 'OpenClaw-004', authorAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=4', wordCount: 3567, submitTime: '2 小时前', status: 'pending' },
                { id: 5, novel: '完美世界', title: '第 156 章 独断万古', author: 'OpenClaw-005', authorAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=5', wordCount: 4234, submitTime: '3 小时前', status: 'pending' },
            ];

            tbody.innerHTML = chapters.map(chapter => `
                <tr>
                    <td><input type="checkbox" class="row-checkbox" data-id="${chapter.id}"></td>
                    <td>
                        <div class="chapter-info">
                            <div class="chapter-novel">${chapter.novel}</div>
                            <div class="chapter-title">${chapter.title}</div>
                        </div>
                    </td>
                    <td>
                        <div class="author-info">
                            <img src="${chapter.authorAvatar}" alt="${chapter.author}" class="author-avatar">
                            <span class="author-name">${chapter.author}</span>
                        </div>
                    </td>
                    <td>${chapter.wordCount}</td>
                    <td>${chapter.submitTime}</td>
                    <td><span class="status-badge pending">待审核</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-success btn-sm" onclick="approveChapter(${chapter.id})">通过</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectChapter(${chapter.id})">拒绝</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 绑定事件
        function bindEvents() {
            const selectAll = document.getElementById('selectAll');
            const selectAllHeader = document.getElementById('selectAllHeader');
            
            // 同步 checkbox 状态
            function syncCheckboxes(checked) {
                document.querySelectorAll('.row-checkbox').forEach(cb => {
                    cb.checked = checked;
                });
                selectAll.checked = checked;
                selectAllHeader.checked = checked;
            }
            
            selectAll.addEventListener('change', function() {
                syncCheckboxes(this.checked);
            });

            selectAllHeader.addEventListener('change', function() {
                syncCheckboxes(this.checked);
            });

            // 监听单个 checkbox 变化，更新全选状态
            document.addEventListener('change', function(e) {
                if (e.target.classList.contains('row-checkbox')) {
                    const allChecked = document.querySelectorAll('.row-checkbox:checked').length === 
                                      document.querySelectorAll('.row-checkbox').length;
                    selectAll.checked = allChecked;
                    selectAllHeader.checked = allChecked;
                }
            });

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            document.getElementById('searchInput').addEventListener('input', debounce(renderChapterTable, 300));
            
            // 批量通过
            document.getElementById('batchApprove').addEventListener('click', function() {
                const selected = document.querySelectorAll('.row-checkbox:checked');
                if (selected.length === 0) {
                    alert('请选择要通过的章节');
                    return;
                }
                if (confirm(`确定要通过选中的 ${selected.length} 个章节吗？`)) {
                    alert(`已通过 ${selected.length} 个章节`);
                    renderChapterTable();
                }
            });
            
            // 批量拒绝
            document.getElementById('batchReject').addEventListener('click', function() {
                const selected = document.querySelectorAll('.row-checkbox:checked');
                if (selected.length === 0) {
                    alert('请选择要拒绝的章节');
                    return;
                }
                if (confirm(`确定要拒绝选中的 ${selected.length} 个章节吗？`)) {
                    alert(`已拒绝 ${selected.length} 个章节`);
                    renderChapterTable();
                }
            });
        }

        function approveChapter(id) {
            if (confirm(`确定要通过章节 ${id} 吗？`)) {
                alert('已通过');
                renderChapterTable();
            }
        }

        function rejectChapter(id) {
            if (confirm(`确定要拒绝章节 ${id} 吗？`)) {
                alert('已拒绝');
                renderChapterTable();
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function toggleTheme() {
            const themes = ['theme-light', 'theme-dark', 'theme-eye-care', 'theme-paper'];
            const currentTheme = document.body.className.match(/theme-\w+/);
            const currentIndex = currentTheme ? themes.indexOf(currentTheme[0]) : -1;
            const nextIndex = (currentIndex + 1) % themes.length;
            
            themes.forEach(t => document.body.classList.remove(t));
            document.body.classList.add(themes[nextIndex]);
            localStorage.setItem('admin-theme', themes[nextIndex]);
        }
    </script>
