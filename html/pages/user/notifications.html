    <script>
        // 模拟通知数据
        const MOCK_NOTIFICATIONS = [
            {
                id: '1',
                type: 'update',

                content: '第1582章 天墓开启 已更新，快去看看吧！',
                icon: '📚',
                is_read: false,
                created_at: '2026-04-12T10:30:00Z',
                link: '../novel/detail.html?id=1'
            },
            {
                id: '2',
                type: 'system',
                title: '欢迎加入 NovelHub',
                content: '感谢您注册 NovelHub，开始您的阅读之旅吧！新用户专享7天VIP体验。',
                icon: '🎉',
                is_read: false,
                created_at: '2026-04-12T09:00:00Z',
                link: '../../index.html'
            },
            {
                id: '3',
                type: 'interaction',
                title: '有人回复了您的评论',
                content: '用户"书虫小王"回复了您在《凡人修仙传》中的评论',
                icon: '💬',
                is_read: false,
                created_at: '2026-04-11T18:45:00Z',
                link: '../novel/detail.html?id=2#comments'
            },
            {
                id: '4',
                type: 'system',
                title: '阅读成就解锁',
                content: '恭喜您解锁"夜猫子"成就，累计阅读超过50小时！',
                icon: '🏆',
                is_read: true,
                created_at: '2026-04-10T22:15:00Z',
                link: '#'
            },
            {
                id: '5',
                type: 'update',
                title: '《凡人修仙传》更新了',
                content: '第2451章 仙界篇 已更新，快去看看吧！',
                icon: '📚',
                is_read: true,
                created_at: '2026-04-10T08:30:00Z',
                link: '../novel/detail.html?id=2'
            },
            {
                id: '6',
                type: 'interaction',
                title: '您的评论被点赞',
                content: '您的评论"这本书太好看了"获得了10个赞',
                icon: '👍',
                is_read: true,
                created_at: '2026-04-09T14:20:00Z',
                link: '#'
            }
        ];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            renderNotifications();
            initFilterTabs();
            initActionButtons();
            updateCounts();
        });

        // 主题初始化
        function initTheme() {
            const savedTheme = localStorage.getItem('novelhub-theme') || 'theme-light';
            document.body.className = savedTheme;

            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const themes = ['theme-light', 'theme-paper', 'theme-dark', 'theme-eye-care'];
                    const currentTheme = themes.find(t => document.body.classList.contains(t)) || 'theme-light';
                    const currentIndex = themes.indexOf(currentTheme);
                    const nextTheme = themes[(currentIndex + 1) % themes.length];

                    document.body.className = nextTheme;
                    localStorage.setItem('novelhub-theme', nextTheme);
                });
            }
        }

        // 更新计数
        function updateCounts() {
            const all = MOCK_NOTIFICATIONS.length;
            const unread = MOCK_NOTIFICATIONS.filter(n => !n.is_read).length;
            const system = MOCK_NOTIFICATIONS.filter(n => n.type === 'system').length;
            const update = MOCK_NOTIFICATIONS.filter(n => n.type === 'update').length;
            const interaction = MOCK_NOTIFICATIONS.filter(n => n.type === 'interaction').length;

            document.getElementById('allCount').textContent = all;
            document.getElementById('unreadCount').textContent = unread;
            document.getElementById('unreadBadge').textContent = unread;
            document.getElementById('systemCount').textContent = system;
            document.getElementById('updateCount').textContent = update;
            document.getElementById('interactionCount').textContent = interaction;

            // 隐藏未读数量为0的badge
            document.getElementById('unreadBadge').style.display = unread > 0 ? 'inline-flex' : 'none';
        }

        // 渲染通知列表
        function renderNotifications(filter = 'all') {
            const container = document.getElementById('notificationsContent');
            const emptyState = document.getElementById('emptyState');

            let notifications = [...MOCK_NOTIFICATIONS];

            // 筛选
            if (filter !== 'all') {
                if (filter === 'unread') {
                    notifications = notifications.filter(n => !n.is_read);
                } else {
                    notifications = notifications.filter(n => n.type === filter);
                }
            }

            // 按时间排序
            notifications.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (notifications.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'flex';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            container.style.display = 'block';
            emptyState.style.display = 'none';
            document.getElementById('pagination').style.display = 'flex';

            container.innerHTML = notifications.map(notification => renderNotificationItem(notification)).join('');
        }

        // 渲染通知项
        function renderNotificationItem(notification) {
            const timeAgo = formatTimeAgo(notification.created_at);
            const unreadClass = notification.is_read ? '' : 'unread';

            return `
                <div class="notification-item ${unreadClass}" data-id="${notification.id}">
                    <div class="notification-icon">${notification.icon}</div>
                    <div class="notification-content">
                        <div class="notification-header">
                            <h3 class="notification-title">${notification.title}</h3>
                            <span class="notification-time">${timeAgo}</span>
                        </div>
                        <p class="notification-text">${notification.content}</p>
                    </div>
                    <div class="notification-actions">
                        ${!notification.is_read ? `<button class="btn-icon btn-sm" onclick="markAsRead('${notification.id}')" title="标记为已读">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </button>` : ''}
                        <button class="btn-icon btn-sm" onclick="deleteNotification('${notification.id}')" title="删除">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                    ${notification.link ? `<a href="${notification.link}" class="notification-link" onclick="markAsRead('${notification.id}')"></a>` : ''}
                </div>
            `;
        }

        // 格式化时间
        function formatTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return '刚刚';
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            if (days < 7) return `${days}天前`;
            return date.toLocaleDateString('zh-CN');
        }

        // 筛选标签
        function initFilterTabs() {
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const filter = this.dataset.type;
                    renderNotifications(filter);
                });
            });
        }

        // 操作按钮
        function initActionButtons() {
            // 全部已读
            document.getElementById('markAllReadBtn').addEventListener('click', function() {
                MOCK_NOTIFICATIONS.forEach(n => n.is_read = true);
                showToast('已将所有通知标记为已读', 'success');
                updateCounts();
                const currentFilter = document.querySelector('.filter-tab.active')?.dataset.type || 'all';
                renderNotifications(currentFilter);
            });

            // 清空通知
            document.getElementById('clearAllBtn').addEventListener('click', function() {
                if (confirm('确定要清空所有通知吗？')) {
                    MOCK_NOTIFICATIONS.length = 0;
                    showToast('已清空所有通知', 'success');
                    updateCounts();
                    renderNotifications();
                }
            });
        }

        // 标记为已读
        function markAsRead(id) {
            const notification = MOCK_NOTIFICATIONS.find(n => n.id === id);
            if (notification) {
                notification.is_read = true;
                updateCounts();
                const currentFilter = document.querySelector('.filter-tab.active')?.dataset.type || 'all';
                renderNotifications(currentFilter);
            }
        }

        // 删除通知
        function deleteNotification(id) {
            const index = MOCK_NOTIFICATIONS.findIndex(n => n.id === id);
            if (index > -1) {
                MOCK_NOTIFICATIONS.splice(index, 1);
                showToast('已删除通知', 'success');
                updateCounts();
                const currentFilter = document.querySelector('.filter-tab.active')?.dataset.type || 'all';
                renderNotifications(currentFilter);
            }
        }

        // 显示Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${type === 'success' ? '✓' : type === 'error' ? '✕' : type === 'warning' ? '⚠' : 'ℹ'}</span>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>

            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.25rem;
        }

        .user-level {
            font-size: 0.875rem;
            color: var(--color-primary);
        }

        .sidebar-nav {
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: all var(--duration-fast);
            border-bottom: 1px solid var(--color-border);
        }

        .sidebar-nav-item:last-child {
            border-bottom: none;
        }

        .sidebar-nav-item:hover {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
        }

        .sidebar-nav-item.active {
            background: var(--color-primary-light);
            color: var(--color-primary);
        }

        .sidebar-nav-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-badge {
            margin-left: auto;
            padding: 0.125rem 0.5rem;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .nav-badge.badge-error {
            background: var(--color-error-light);
            color: var(--color-error);
        }

        /* 主内容区 */
        .notifications-main {
            min-height: 600px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .page-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .page-actions .btn-secondary {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-actions .btn-secondary svg {
            width: 16px;
            height: 16px;
        }

        /* 筛选标签 */
        .notification-filter {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--color-border);
            overflow-x: auto;
        }

        .filter-tab {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--duration-fast);
            white-space: nowrap;
        }

        .filter-tab:hover {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
        }

        .filter-tab.active {
            background: var(--color-primary-light);
            color: var(--color-primary);
            font-weight: 500;
        }

        .filter-count {
            padding: 0.125rem 0.375rem;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-full);
            font-size: 0.625rem;
            font-weight: 500;
        }

        .filter-count.badge-error {
            background: var(--color-error-light);
            color: var(--color-error);
        }

        /* 通知列表 */
        .notifications-content {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .notification-item {
            position: relative;
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            transition: all var(--duration-fast);
        }

        .notification-item:hover {
            border-color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .notification-item.unread {
            background: var(--color-primary-light);
            border-color: var(--color-primary);
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            top: 1rem;
            left: 0.5rem;
            width: 6px;
            height: 6px;
            background: var(--color-primary);
            border-radius: var(--radius-full);
        }

        .notification-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-lg);
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .notification-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .notification-time {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            flex-shrink: 0;
        }

        .notification-text {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        .notification-actions {
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .notification-link {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .notification-actions {
            position: relative;
            z-index: 2;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .btn-icon:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .btn-icon svg {
            width: 14px;
            height: 14px;
        }

        /* 空状态 */
        .empty-state {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
        }

        /* 分页 */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-border);
        }

        .pagination-btn {
            padding: 0.5rem 1rem;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .notifications-layout {
                grid-template-columns: 1fr;
            }

            .notifications-sidebar {
                position: static;
                display: flex;
                gap: 1rem;
                overflow-x: auto;
            }

            .user-card {
                display: none;
            }

            .sidebar-nav {
                display: flex;
                min-width: max-content;
            }

            .sidebar-nav-item {
                border-bottom: none;
                border-right: 1px solid var(--color-border);
            }
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .page-actions {
                width: 100%;
            }

            .page-actions .btn-secondary {
                flex: 1;
                justify-content: center;
            }

            .notification-filter {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .notification-item {
                flex-direction: column;
            }

            .notification-actions {
                justify-content: flex-end;
            }
        }
    </style>
</body>
</html>
