    <script>
        // 初始化函数
        function initCommon() {
            const saved = localStorage.getItem('novelhub-theme');
            if (saved) document.body.className = saved;
            const toggle = document.getElementById('themeToggle');
            if (toggle) toggle.addEventListener('click', () => {
                const themes = ['theme-light', 'theme-paper', 'theme-dark', 'theme-eye-care'];
                const current = themes.findIndex(t => document.body.classList.contains(t));
                document.body.className = themes[(current + 1) % themes.length];
                localStorage.setItem('novelhub-theme', document.body.className);
            });
        }
        
        // 初始化认证页面
        function initAuthPage() {
            const tabs = document.querySelectorAll('.auth-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const tabType = tab.dataset.tab;
                    const loginForm = document.getElementById('loginForm');
                    const registerForm = document.getElementById('registerForm');
                    if (tabType === 'login') {
                        loginForm.style.display = 'block';
                        registerForm.style.display = 'none';
                    } else {
                        loginForm.style.display = 'none';
                        registerForm.style.display = 'block';
                    }
                });
            });
            const toggles = document.querySelectorAll('.password-toggle');
            toggles.forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const inputWrapper = toggle.closest('.password-input-wrapper');
                    const input = inputWrapper.querySelector('input');
                    if (input.type === 'password') {
                        input.type = 'text';
                    } else {
                        input.type = 'password';
                    }
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            initCommon();
            initAuthPage();
        });
    </script>

            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .auth-social {
            display: flex;
            gap: 1rem;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-surface);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .btn-social:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .btn-social svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        /* 修复：添加主题切换按钮样式 */
        .auth-theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
            width: 2.5rem;
            height: 2.5rem;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .auth-theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .auth-theme-toggle svg {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--color-text-secondary);
        }

        .auth-theme-toggle .icon-moon {
            display: none;
        }

        .theme-dark .auth-theme-toggle .icon-sun,
        .theme-eye-care .auth-theme-toggle .icon-sun {
            display: none;
        }

        .theme-dark .auth-theme-toggle .icon-moon,
        .theme-eye-care .auth-theme-toggle .icon-moon {
            display: block;
        }

        @media (max-width: 1024px) {
            .auth-sidebar {
                display: none;
            }

            .auth-main {
                max-width: 100%;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</body>
</html>
