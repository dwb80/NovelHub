    <script>
        // 模拟收藏数据
        const MOCK_FAVORITES = [
            {
                id: '1',
                type: 'novel',
                title: '斗破苍穹',
                subtitle: '天蚕土豆',
                cover: 'https://picsum.photos/200/267?random=1',
                desc: '这里是斗气大陆，没有花俏艳丽的魔法，有的，仅仅是繁衍到巅峰的斗气！',
                tags: ['玄幻', '完结', '1000万+字'],
                created_at: '2026-04-10T10:00:00Z'
            },
            {
                id: '2',
                type: 'novel',
                title: '凡人修仙传',
                subtitle: '忘语',
                cover: 'https://picsum.photos/200/267?random=2',
                desc: '一个普通山村小子，偶然下进入到当地江湖小门派，成了一名记名弟子。',
                tags: ['仙侠', '完结', '700万+字'],
                created_at: '2026-04-09T15:30:00Z'
            },
            {
                id: '3',
                type: 'author',
                title: '天蚕土豆',
                subtitle: '知名玄幻作家',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=author1',
                desc: '代表作：《斗破苍穹》《武动乾坤》《大主宰》',
                tags: ['玄幻', '12部作品', '粉丝100万+'],
                created_at: '2026-04-08T09:00:00Z'
            },
            {
                id: '4',
                type: 'author',
                title: '忘语',
                subtitle: '仙侠小说大神',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=author2',
                desc: '代表作：《凡人修仙传》《魔天记》《玄界之门》',
                tags: ['仙侠', '8部作品', '粉丝80万+'],
                created_at: '2026-04-07T14:20:00Z'
            },
            {
                id: '5',
                type: 'booklist',
                title: '2026年必看玄幻小说',
                subtitle: '精选50本',
                cover: 'https://picsum.photos/200/267?random=3',
                desc: '本年度最受欢迎的玄幻小说合集，不容错过！',
                tags: ['书单', '50本', '收藏1万+'],
                created_at: '2026-04-05T11:00:00Z'
            }
        ];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            renderFavorites();
            initFilterTabs();
            initCreateFolder();
        });

        // 主题初始化
        function initTheme() {
            const savedTheme = localStorage.getItem('novelhub-theme') || 'theme-light';
            document.body.className = savedTheme;

            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const themes = ['theme-light', 'theme-paper', 'theme-dark', 'theme-eye-care'];
                    const currentTheme = themes.find(t => document.body.classList.contains(t)) || 'theme-light';
                    const currentIndex = themes.indexOf(currentTheme);
                    const nextTheme = themes[(currentIndex + 1) % themes.length];

                    document.body.className = nextTheme;
                    localStorage.setItem('novelhub-theme', nextTheme);
                });
            }
        }

        // 渲染收藏夹
        function renderFavorites(filter = 'all') {
            const container = document.getElementById('favoritesContent');
            const emptyState = document.getElementById('emptyState');

            let favorites = [...MOCK_FAVORITES];

            // 筛选
            if (filter !== 'all') {
                favorites = favorites.filter(item => item.type === filter);
            }

            // 按时间排序
            favorites.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // 更新数量
            document.getElementById('favoritesCount').textContent = favorites.length;

            if (favorites.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'flex';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            container.style.display = 'grid';
            emptyState.style.display = 'none';
            document.getElementById('pagination').style.display = 'flex';

            container.innerHTML = favorites.map(item => renderFavoriteItem(item)).join('');
        }

        // 渲染收藏项
        function renderFavoriteItem(item) {
            const typeLabels = {
                'novel': '📚 小说',
                'author': '✍️ 作者',
                'booklist': '📑 书单'
            };

            const imageUrl = item.type === 'author' ? item.avatar : item.cover;
            const linkUrl = item.type === 'novel' 
                ? `../novel/detail.html?id=${item.id}`
                : item.type === 'author'
                ? `../author/profile.html?id=${item.id}`
                : '#';

            return `
                <div class="favorite-item" data-id="${item.id}" data-type="${item.type}">
                    <div class="favorite-cover">
                        <img src="${imageUrl}" alt="${item.title}" loading="lazy">
                        <span class="favorite-type">${typeLabels[item.type]}</span>
                    </div>
                    <div class="favorite-info">
                        <h3 class="favorite-title">${item.title}</h3>
                        <p class="favorite-subtitle">${item.subtitle}</p>
                        <p class="favorite-desc">${item.desc}</p>
                        <div class="favorite-tags">
                            ${item.tags.map(tag => `<span class="favorite-tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="favorite-actions">
                        <a href="${linkUrl}" class="btn-primary btn-sm">查看</a>
                        <button class="btn-icon" onclick="removeFavorite('${item.id}')" title="取消收藏">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
        }

        // 筛选标签
        function initFilterTabs() {
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const filter = this.dataset.type;
                    renderFavorites(filter);
                });
            });
        }

        // 新建文件夹
        function initCreateFolder() {
            const btn = document.getElementById('createFolderBtn');
            if (btn) {
                btn.addEventListener('click', function() {
                    const name = prompt('请输入文件夹名称：');
                    if (name && name.trim()) {
                        showToast(`文件夹"${name.trim()}"创建成功`, 'success');
                    }
                });
            }
        }

        // 取消收藏
        function removeFavorite(id) {
            if (confirm('确定要取消收藏吗？')) {
                const index = MOCK_FAVORITES.findIndex(f => f.id === id);
                if (index > -1) {
                    MOCK_FAVORITES.splice(index, 1);
                    showToast('已取消收藏', 'success');
                    const currentFilter = document.querySelector('.filter-tab.active')?.dataset.type || 'all';
                    renderFavorites(currentFilter);
                }
            }
        }

        // 显示Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${type === 'success' ? '✓' : type === 'error' ? '✕' : type === 'warning' ? '⚠' : 'ℹ'}</span>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>

        }

        /* 筛选标签 */
        .favorites-filter {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--color-border);
        }

        .filter-tab {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .filter-tab:hover {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
        }

        .filter-tab.active {
            background: var(--color-primary-light);
            color: var(--color-primary);
            font-weight: 500;
        }

        /* 收藏内容网格 */
        .favorites-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .favorite-item {
            display: flex;
            flex-direction: column;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            transition: all var(--duration-fast);
        }

        .favorite-item:hover {
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .favorite-cover {
            position: relative;
            aspect-ratio: 3/2;
            overflow: hidden;
        }

        .favorite-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--duration-base);
        }

        .favorite-item:hover .favorite-cover img {
            transform: scale(1.05);
        }

        .favorite-type {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: rgba(0, 0, 0, 0.7);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: white;
            backdrop-filter: blur(4px);
        }

        .favorite-info {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }

        .favorite-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .favorite-subtitle {
            font-size: 0.875rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .favorite-desc {
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .favorite-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .favorite-tag {
            padding: 0.25rem 0.5rem;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-sm);
            font-size: 0.6875rem;
            color: var(--color-text-secondary);
        }

        .favorite-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0 1rem 1rem;
        }

        .favorite-actions .btn-primary {
            flex: 1;
        }

        .favorite-actions .btn-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .favorite-actions .btn-icon:hover {
            border-color: var(--color-error);
            color: var(--color-error);
        }

        .favorite-actions .btn-icon svg {
            width: 16px;
            height: 16px;
        }

        /* 空状态 */
        .empty-state {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
        }

        /* 分页 */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-border);
        }

        .pagination-btn {
            padding: 0.5rem 1rem;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .favorites-layout {
                grid-template-columns: 1fr;
            }

            .favorites-sidebar {
                position: static;
                display: flex;
                gap: 1rem;
                overflow-x: auto;
            }

            .user-card {
                display: none;
            }

            .sidebar-nav {
                display: flex;
                min-width: max-content;
            }

            .sidebar-nav-item {
                border-bottom: none;
                border-right: 1px solid var(--color-border);
            }
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .favorites-content {
                grid-template-columns: 1fr;
            }

            .favorites-filter {
                overflow-x: auto;
                flex-wrap: nowrap;
            }
        }
    </style>
</body>
</html>
