<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的书架 - NovelHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <style>
        /* Page Layout */
        .bookshelf-page {
            min-height: 100vh;
            background: var(--color-bg-secondary);
        }

        /* Header */
        .bookshelf-header {
            background: white;
            border-bottom: 1px solid var(--color-border);
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .bookshelf-header__container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .bookshelf-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .bookshelf-title svg {
            width: 1.5rem;
            height: 1.5rem;
            color: var(--color-primary);
        }

        .bookshelf-stats {
            display: flex;
            gap: 1.5rem;
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .bookshelf-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .bookshelf-stat__value {
            font-weight: 600;
            color: var(--color-primary);
        }

        /* Filter Tabs */
        .bookshelf-filters {
            background: white;
            border-bottom: 1px solid var(--color-border);
            padding: 0;
        }

        .bookshelf-filters__container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .filter-tabs {
            display: flex;
            gap: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-tabs::-webkit-scrollbar {
            display: none;
        }

        .filter-tab {
            padding: 1rem 1.25rem;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-tab:hover {
            color: var(--color-text-primary);
        }

        .filter-tab.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
        }

        /* Main Content */
        .bookshelf-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Book Card */
        .book-card {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--color-border);
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .book-card:hover {
            border-color: var(--color-primary-300);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .book-card__cover {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            background: linear-gradient(135deg, var(--color-primary-100) 0%, var(--color-primary-200) 100%);
        }

        .book-card__cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .book-card:hover .book-card__cover img {
            transform: scale(1.05);
        }

        .book-card__progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(0,0,0,0.2);
        }

        .book-card__progress-bar {
            height: 100%;
            background: var(--color-primary);
            transition: width 0.3s ease;
        }

        .book-card__badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            padding: 0.25rem 0.625rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: var(--radius-full);
            background: var(--color-primary);
            color: white;
        }

        .book-card__badge--completed {
            background: var(--color-success);
        }

        .book-card__badge--new {
            background: var(--color-warning);
        }

        .book-card__actions {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }

        .book-card:hover .book-card__actions {
            opacity: 1;
            transform: translateY(0);
        }

        .book-card__action-btn {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--color-text-secondary);
            transition: all 0.2s ease;
        }

        .book-card__action-btn:hover {
            background: white;
            color: var(--color-primary);
            transform: scale(1.1);
        }

        .book-card__action-btn--danger:hover {
            color: var(--color-error);
        }

        .book-card__info {
            padding: 1rem;
        }

        .book-card__title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.375rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .book-card__author {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.75rem;
        }

        .book-card__meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8125rem;
            color: var(--color-text-muted);
        }

        .book-card__chapter {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .book-card__update {
            color: var(--color-success);
        }

        /* Continue Reading Button */
        .book-card__continue {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.625rem;
            margin-top: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-primary);
            background: var(--color-primary-50);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .book-card__continue:hover {
            background: var(--color-primary-100);
        }

        .book-card__continue:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .book-card__continue .btn-content {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .book-card__continue .btn-loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .book-card__continue .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* List View */
        .books-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .book-list-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--color-border);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .book-list-item:hover {
            border-color: var(--color-primary-300);
            box-shadow: var(--shadow-md);
        }

        .book-list-item__cover {
            width: 80px;
            height: 110px;
            border-radius: var(--radius-md);
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--color-primary-100) 0%, var(--color-primary-200) 100%);
        }

        .book-list-item__cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-list-item__content {
            flex: 1;
            min-width: 0;
        }

        .book-list-item__title {
            font-size: 1.0625rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .book-list-item__author {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

        .book-list-item__desc {
            font-size: 0.8125rem;
            color: var(--color-text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .book-list-item__meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.8125rem;
            color: var(--color-text-muted);
        }

        .book-list-item__progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .book-list-item__progress-bar {
            width: 60px;
            height: 4px;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .book-list-item__progress-fill {
            height: 100%;
            background: var(--color-primary);
            border-radius: var(--radius-full);
        }

        .book-list-item__actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            justify-content: center;
        }

        /* View Toggle */
        .view-toggle {
            display: flex;
            gap: 0.5rem;
            background: var(--color-bg-secondary);
            padding: 0.25rem;
            border-radius: var(--radius-lg);
        }

        .view-toggle__btn {
            padding: 0.5rem;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--color-text-secondary);
            transition: all 0.2s ease;
        }

        .view-toggle__btn:hover {
            color: var(--color-text-primary);
        }

        .view-toggle__btn.active {
            background: white;
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .view-toggle__btn svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        /* Sort Dropdown */
        .sort-dropdown {
            position: relative;
        }

        .sort-dropdown__btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.875rem;
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            background: var(--color-bg-secondary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sort-dropdown__btn:hover {
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
        }

        /* Skeleton Loading */
        .skeleton-card {
            background: white;
            border-radius: var(--radius-xl);
            overflow: hidden;
        }

        .skeleton-card__cover {
            aspect-ratio: 3/4;
            background: linear-gradient(90deg, var(--color-bg-tertiary) 25%, var(--color-bg-secondary) 50%, var(--color-bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }

        .skeleton-card__info {
            padding: 1rem;
        }

        .skeleton-card__title {
            height: 1.25rem;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            animation: skeleton-loading 1.5s infinite;
        }

        .skeleton-card__author {
            height: 0.875rem;
            width: 60%;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-sm);
            animation: skeleton-loading 1.5s infinite;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .empty-state__icon {
            width: 6rem;
            height: 6rem;
            color: var(--color-text-muted);
            margin-bottom: 1.5rem;
        }

        .empty-state__title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }

        .empty-state__desc {
            font-size: 0.9375rem;
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
            max-width: 300px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .bookshelf-header__container {
                flex-direction: column;
                align-items: flex-start;
            }

            .bookshelf-stats {
                width: 100%;
                justify-content: space-between;
            }

            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .book-card__actions {
                opacity: 1;
                transform: translateY(0);
            }

            .book-list-item {
                flex-direction: column;
            }

            .book-list-item__cover {
                width: 100%;
                height: 200px;
            }

            .book-list-item__actions {
                flex-direction: row;
                justify-content: flex-end;
            }
        }

        @media (max-width: 480px) {
            .books-grid {
                grid-template-columns: 1fr;
            }

            .filter-tab {
                padding: 0.875rem 1rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="bookshelf-page">
        <!-- Header -->
        <header class="bookshelf-header">
            <div class="bookshelf-header__container">
                <h1 class="bookshelf-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    我的书架
                </h1>
                <div class="bookshelf-stats">
                    <div class="bookshelf-stat">
                        <span>共收藏</span>
                        <span class="bookshelf-stat__value" id="totalBooks">0</span>
                        <span>本</span>
                    </div>
                    <div class="bookshelf-stat">
                        <span>已读完</span>
                        <span class="bookshelf-stat__value" id="completedBooks">0</span>
                        <span>本</span>
                    </div>
                    <div class="bookshelf-stat">
                        <span>今日阅读</span>
                        <span class="bookshelf-stat__value" id="todayRead">0</span>
                        <span>分钟</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="bookshelf-filters">
            <div class="bookshelf-filters__container">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">全部</button>
                    <button class="filter-tab" data-filter="reading">阅读中</button>
                    <button class="filter-tab" data-filter="completed">已读完</button>
                    <button class="filter-tab" data-filter="unread">未开始</button>
                    <button class="filter-tab" data-filter="updated">有更新</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="bookshelf-main">
            <!-- Toolbar -->
            <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <div class="view-toggle">
                    <button class="view-toggle__btn active" data-view="grid" title="网格视图">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                    <button class="view-toggle__btn" data-view="list" title="列表视图">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="sort-dropdown">
                    <button class="sort-dropdown__btn">
                        <span>最近阅读</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Books Container -->
            <div id="booksContainer">
                <!-- Content will be loaded dynamically -->
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        // Fallback: showToast 函数（当模块导入不可用时使用）
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${type === 'success' ? '✓' : type === 'error' ? '✕' : type === 'warning' ? '⚠' : 'ℹ'}</span>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Fallback: showEmptyState 函数
        function showEmptyState(container, options = {}) {
            const { title = '暂无数据', description = '', actionText = '', actionLink = '' } = options;
            container.innerHTML = `
                <div class="empty-state">
                    <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                    </svg>
                    <h3 class="empty-state__title">${title}</h3>
                    <p class="empty-state__desc">${description}</p>
                    ${actionLink ? `<a href="${actionLink}" class="btn-primary">${actionText}</a>` : ''}
                </div>
            `;
        }

        // 统一 localStorage 键名前缀
        const STORAGE_KEY = 'novelhub_bookshelf';
        const READING_PROGRESS_KEY = 'novelhub_reading_progress';

        // 模拟书架数据
        let bookshelfData = [];

        // 当前视图和筛选
        let currentView = 'grid';
        let currentFilter = 'all';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadBookshelfData();
            initEventListeners();
            renderBooks();
            updateStats();
        });

        // 加载书架数据
        function loadBookshelfData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    bookshelfData = JSON.parse(saved);
                } else {
                    // 初始化示例数据
                    bookshelfData = [
                        {
                            id: 1,
                            title: 'AI觉醒之路',
                            author: '未来作家',
                            cover: '../../assets/images/covers/ai-awoking.jpg',
                            progress: 35,
                            currentChapter: '第4章：记忆守护者',
                            totalChapters: 50,
                            status: 'reading',
                            lastRead: Date.now() - 3600000,
                            hasUpdate: true
                        },
                        {
                            id: 2,
                            title: '星际穿越者',
                            author: '科幻大师',
                            cover: '../../assets/images/covers/default-cover.svg',
                            progress: 0,
                            currentChapter: '尚未开始',
                            totalChapters: 120,
                            status: 'unread',
                            lastRead: null,
                            hasUpdate: false
                        },
                        {
                            id: 3,
                            title: '魔法学院的废柴学生',
                            author: '奇幻写手',
                            cover: '../../assets/images/covers/default-cover.svg',
                            progress: 100,
                            currentChapter: '已读完',
                            totalChapters: 200,
                            status: 'completed',
                            lastRead: Date.now() - 86400000,
                            hasUpdate: false
                        }
                    ];
                    saveBookshelfData();
                }
            } catch (e) {
                console.error('加载书架数据失败:', e);
                bookshelfData = [];
            }
        }

        // 保存书架数据
        function saveBookshelfData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(bookshelfData));
            } catch (e) {
                console.error('保存书架数据失败:', e);
            }
        }

        // 初始化事件监听
        function initEventListeners() {
            // 筛选标签
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderBooks();
                });
            });

            // 视图切换
            document.querySelectorAll('.view-toggle__btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.view-toggle__btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentView = btn.dataset.view;
                    renderBooks();
                });
            });
        }

        // 获取筛选后的书籍
        function getFilteredBooks() {
            if (currentFilter === 'all') {
                return bookshelfData;
            }
            return bookshelfData.filter(book => book.status === currentFilter || 
                (currentFilter === 'updated' && book.hasUpdate));
        }

        // 渲染书籍列表
        function renderBooks() {
            const container = document.getElementById('booksContainer');
            const filteredBooks = getFilteredBooks();

            if (filteredBooks.length === 0) {
                showEmptyState(container, {
                    type: currentFilter === 'all' ? 'bookshelf' : 'default',
                    title: getEmptyTitle(),
                    description: getEmptyDescription(),
                    actionText: '去发现好书',
                    actionLink: '../index.html'
                });
                return;
            }

            if (currentView === 'grid') {
                renderGridView(container, filteredBooks);
            } else {
                renderListView(container, filteredBooks);
            }
        }

        // 获取空状态标题
        function getEmptyTitle() {
            const titles = {
                all: '书架空空如也',
                reading: '暂无阅读中的书籍',
                completed: '还没有读完的书籍',
                unread: '没有未开始的书籍',
                updated: '暂无有更新的书籍'
            };
            return titles[currentFilter] || '暂无数据';
        }

        // 获取空状态描述
        function getEmptyDescription() {
            const descriptions = {
                all: '还没有收藏任何小说，快去发现精彩作品吧',
                reading: '您还没有开始阅读任何书籍',
                completed: '读完的书籍会显示在这里',
                unread: '所有书籍都已经在阅读中或已读完',
                updated: '订阅的书籍有更新时会显示在这里'
            };
            return descriptions[currentFilter] || '';
        }

        // 渲染网格视图
        function renderGridView(container, books) {
            container.innerHTML = `
                <div class="books-grid">
                    ${books.map(book => createBookCard(book)).join('')}
                </div>
            `;

            // 绑定卡片事件
            bindBookCardEvents(container);
        }

        // 渲染列表视图
        function renderListView(container, books) {
            container.innerHTML = `
                <div class="books-list">
                    ${books.map(book => createBookListItem(book)).join('')}
                </div>
            `;

            // 绑定列表项事件
            bindBookListEvents(container);
        }

        // 创建书籍卡片
        function createBookCard(book) {
            const badge = book.status === 'completed' ? 
                '<span class="book-card__badge book-card__badge--completed">已读完</span>' :
                book.hasUpdate ? 
                '<span class="book-card__badge book-card__badge--new">有更新</span>' : '';

            return `
                <div class="book-card" data-book-id="${book.id}">
                    <div class="book-card__cover">
                        <img src="${book.cover}" alt="${book.title}" loading="lazy">
                        <div class="book-card__progress">
                            <div class="book-card__progress-bar" style="width: ${book.progress}%"></div>
                        </div>
                        ${badge}
                        <div class="book-card__actions">
                            <button class="book-card__action-btn" data-action="favorite" title="收藏">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </button>
                            <button class="book-card__action-btn book-card__action-btn--danger" data-action="remove" title="删除">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="book-card__info">
                        <h3 class="book-card__title">${book.title}</h3>
                        <p class="book-card__author">${book.author}</p>
                        <div class="book-card__meta">
                            <span class="book-card__chapter">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                                </svg>
                                ${book.currentChapter}
                            </span>
                            ${book.hasUpdate ? '<span class="book-card__update">有更新</span>' : ''}
                        </div>
                        <button class="book-card__continue" data-action="continue" type="button" data-loading="false">
                            <span class="btn-content">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                <span class="btn-text">${book.progress > 0 ? '继续阅读' : '开始阅读'}</span>
                            </span>
                            <span class="btn-loading" style="display: none;">
                                <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"></circle>
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>
            `;
        }

        // 创建书籍列表项
        function createBookListItem(book) {
            return `
                <div class="book-list-item" data-book-id="${book.id}">
                    <div class="book-list-item__cover">
                        <img src="${book.cover}" alt="${book.title}" loading="lazy">
                    </div>
                    <div class="book-list-item__content">
                        <h3 class="book-list-item__title">${book.title}</h3>
                        <p class="book-list-item__author">${book.author}</p>
                        <p class="book-list-item__desc">这是小说的简介描述，展示小说的主要内容和特色...</p>
                        <div class="book-list-item__meta">
                            <span>共${book.totalChapters}章</span>
                            <span class="book-list-item__progress">
                                <span>已读 ${book.progress}%</span>
                                <span class="book-list-item__progress-bar">
                                    <span class="book-list-item__progress-fill" style="width: ${book.progress}%"></span>
                                </span>
                            </span>
                            ${book.hasUpdate ? '<span style="color: var(--color-success);">有更新</span>' : ''}
                        </div>
                    </div>
                    <div class="book-list-item__actions">
                        <button class="nhub-btn nhub-btn--primary nhub-btn--sm" data-action="continue" type="button" data-loading="false">
                            <span class="btn-content">${book.progress > 0 ? '继续阅读' : '开始阅读'}</span>
                            <span class="btn-loading" style="display: none;">
                                <svg class="spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"></circle>
                                </svg>
                            </span>
                        </button>
                        <button class="nhub-btn nhub-btn--ghost nhub-btn--sm" data-action="remove" type="button">
                            删除
                        </button>
                    </div>
                </div>
            `;
        }

        // 绑定卡片事件
        function bindBookCardEvents(container) {
            container.querySelectorAll('.book-card').forEach(card => {
                const bookId = parseInt(card.dataset.bookId);

                // 点击卡片
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.book-card__actions') && !e.target.closest('.book-card__continue')) {
                        continueReading(bookId);
                    }
                });

                // 继续阅读按钮
                card.querySelector('[data-action="continue"]')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    continueReading(bookId, e.currentTarget);
                });

                // 收藏按钮
                card.querySelector('[data-action="favorite"]')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(bookId);
                });

                // 删除按钮
                card.querySelector('[data-action="remove"]')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeBook(bookId);
                });
            });
        }

        // 绑定列表项事件
        function bindBookListEvents(container) {
            container.querySelectorAll('.book-list-item').forEach(item => {
                const bookId = parseInt(item.dataset.bookId);

                // 点击列表项
                item.addEventListener('click', (e) => {
                    if (!e.target.closest('.book-list-item__actions')) {
                        continueReading(bookId);
                    }
                });

                // 继续阅读按钮
                item.querySelector('[data-action="continue"]')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    continueReading(bookId, e.currentTarget);
                });

                // 删除按钮
                item.querySelector('[data-action="remove"]')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeBook(bookId);
                });
            });
        }

        // 继续阅读
        async function continueReading(bookId, btnElement = null) {
            // 设置按钮加载状态
            if (btnElement) {
                if (btnElement.dataset.loading === 'true') return;
                setButtonLoading(btnElement, true);
            }

            const book = bookshelfData.find(b => b.id === bookId);
            if (book) {
                try {
                    // 更新最后阅读时间
                    book.lastRead = Date.now();
                    if (book.status === 'unread') {
                        book.status = 'reading';
                    }
                    saveBookshelfData();

                    showToast(`正在打开《${book.title}》`, 'success');

                    // 模拟加载延迟
                    await new Promise(resolve => setTimeout(resolve, 300));

                    // 跳转到阅读页面
                    if (bookId === 1) {
                        window.location.href = '../novel/ai-awoking/reader.html';
                    } else {
                        // 其他书籍使用通用阅读器
                        window.location.href = `../reader/index.html?book=${bookId}`;
                    }
                } catch (error) {
                    console.error('继续阅读错误:', error);
                    showToast('打开失败，请重试', 'error');
                    if (btnElement) {
                        setButtonLoading(btnElement, false);
                    }
                }
            }
        }

        // 设置按钮加载状态
        function setButtonLoading(btn, loading) {
            btn.dataset.loading = loading ? 'true' : 'false';
            btn.disabled = loading;
            const content = btn.querySelector('.btn-content');
            const spinner = btn.querySelector('.btn-loading');

            if (content) content.style.display = loading ? 'none' : 'inline-flex';
            if (spinner) spinner.style.display = loading ? 'inline-flex' : 'none';
        }

        // 切换收藏
        function toggleFavorite(bookId) {
            showToast('已添加到收藏', 'success');
        }

        // 删除书籍
        function removeBook(bookId) {
            if (confirm('确定要从书架删除这本书吗？')) {
                bookshelfData = bookshelfData.filter(b => b.id !== bookId);
                saveBookshelfData();
                renderBooks();
                updateStats();
                showToast('已从书架删除', 'success');
            }
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalBooks').textContent = bookshelfData.length;
            document.getElementById('completedBooks').textContent = 
                bookshelfData.filter(b => b.status === 'completed').length;
            
            // 计算今日阅读时间（模拟）
            const todayRead = Math.floor(Math.random() * 120) + 30;
            document.getElementById('todayRead').textContent = todayRead;
        }
    </script>
</body>
</html>
