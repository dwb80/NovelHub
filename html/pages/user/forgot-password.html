<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 | NovelHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/themes.css">
</head>
<body class="theme-light">
    <div id="toastContainer" class="toast-container"></div>

    <div class="auth-page">
        <div class="auth-sidebar">
            <a href="../../index.html" class="auth-logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span class="logo-text">NovelHub</span>
            </a>
            <div class="auth-sidebar-content">
                <h1 class="auth-sidebar-title">找回密码</h1>
                <p class="auth-sidebar-desc">通过邮箱验证，快速找回你的账户</p>
                <div class="auth-features">
                    <div class="auth-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <div>
                            <h4>安全验证</h4>
                            <p>邮箱验证确保账户安全</p>
                        </div>
                    </div>
                    <div class="auth-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <div>
                            <h4>便捷操作</h4>
                            <p>简单几步即可重置密码</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="auth-main">
            <div class="auth-form-container">
                <div class="auth-header">
                    <a href="login.html" class="back-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        返回登录
                    </a>
                    <h2 class="auth-form-title">找回密码</h2>
                    <p class="auth-form-subtitle">按照以下步骤重置您的密码</p>
                </div>

                <!-- 步骤指示器 -->
                <div class="step-indicator">
                    <div class="step active" data-step="1">
                        <div class="step-number">1</div>
                        <div class="step-label">验证邮箱</div>
                    </div>
                    <div class="step-line"></div>
                    <div class="step" data-step="2">
                        <div class="step-number">2</div>
                        <div class="step-label">输入验证码</div>
                    </div>
                    <div class="step-line"></div>
                    <div class="step" data-step="3">
                        <div class="step-number">3</div>
                        <div class="step-label">重置密码</div>
                    </div>
                </div>

                <!-- 步骤1：输入邮箱 -->
                <div class="step-container" id="step1">
                    <form class="auth-form" id="emailForm" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="resetEmail">邮箱地址</label>
                            <input 
                                type="email" 
                                id="resetEmail" 
                                class="form-input" 
                                placeholder="请输入注册时的邮箱" 
                                required
                                autocomplete="email"
                                aria-describedby="emailError"
                            >
                            <span class="form-error" id="emailError"></span>
                            <p class="form-hint">我们将向您的邮箱发送验证码</p>
                        </div>

                        <button type="submit" class="btn-primary btn-full" id="sendCodeBtn">
                            <span class="btn-text">发送验证码</span>
                            <span class="btn-loading" style="display: none;">
                                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"></circle>
                                </svg>
                                发送中...
                            </span>
                        </button>
                    </form>
                </div>

                <!-- 步骤2：输入验证码 -->
                <div class="step-container" id="step2" style="display: none;">
                    <form class="auth-form" id="codeForm" novalidate>
                        <div class="form-group">
                            <label class="form-label">验证码</label>
                            <div class="code-input-group">
                                <input 
                                    type="text" 
                                    id="verifyCode" 
                                    class="form-input code-input" 
                                    placeholder="请输入6位验证码" 
                                    maxlength="6" 
                                    required
                                    autocomplete="one-time-code"
                                    inputmode="numeric"
                                    pattern="[0-9]*"
                                    aria-describedby="codeError"
                                >
                                <button type="button" class="btn-secondary" id="resendCode" disabled>
                                    <span class="resend-text">60秒后重发</span>
                                </button>
                            </div>
                            <span class="form-error" id="codeError"></span>
                            <p class="form-hint success">验证码已发送到 <strong id="maskedEmail"></strong></p>
                        </div>

                        <button type="submit" class="btn-primary btn-full" id="verifyBtn">
                            <span class="btn-text">验证</span>
                            <span class="btn-loading" style="display: none;">
                                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"></circle>
                                </svg>
                                验证中...
                            </span>
                        </button>
                    </form>
                </div>

                <!-- 步骤3：重置密码 -->
                <div class="step-container" id="step3" style="display: none;">
                    <form class="auth-form" id="passwordForm" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="newPassword">新密码</label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="newPassword" 
                                    class="form-input" 
                                    placeholder="至少8位，包含字母和数字" 
                                    required 
                                    minlength="8"
                                    autocomplete="new-password"
                                    aria-describedby="newPasswordError passwordStrength"
                                >
                                <button type="button" class="password-toggle" aria-label="显示密码" tabindex="-1">
                                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                            <div class="password-strength" id="passwordStrength">
                                <div class="strength-bar">
                                    <span class="strength-item" data-level="1"></span>
                                    <span class="strength-item" data-level="2"></span>
                                    <span class="strength-item" data-level="3"></span>
                                    <span class="strength-item" data-level="4"></span>
                                </div>
                                <span class="strength-text" id="strengthText"></span>
                            </div>
                            <span class="form-error" id="newPasswordError"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">确认新密码</label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="confirmPassword" 
                                    class="form-input" 
                                    placeholder="请再次输入新密码" 
                                    required
                                    autocomplete="new-password"
                                    aria-describedby="confirmError"
                                >
                                <button type="button" class="password-toggle" aria-label="显示密码" tabindex="-1">
                                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                            <span class="form-error" id="confirmError"></span>
                        </div>

                        <button type="submit" class="btn-primary btn-full" id="resetBtn">
                            <span class="btn-text">重置密码</span>
                            <span class="btn-loading" style="display: none;">
                                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"></circle>
                                </svg>
                                重置中...
                            </span>
                        </button>
                    </form>
                </div>

                <!-- 成功状态 -->
                <div class="success-message" id="successMessage" style="display: none;">
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h3>密码重置成功</h3>
                    <p>您的密码已成功重置，请使用新密码登录</p>
                    <a href="login.html" class="btn-primary btn-full">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/mock/data-global.js"></script>
    
    <!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->
    <script src="../../assets/js/fixes/index.js"></script>
    
    <script>
        // 初始化函数
        function initCommon() {
            const saved = localStorage.getItem('novelhub-theme');
            if (saved) document.body.className = saved;
            const toggle = document.getElementById('themeToggle');
            if (toggle) toggle.addEventListener('click', () => {
                const themes = ['theme-light', 'theme-paper', 'theme-dark', 'theme-eye-care'];
                const current = themes.findIndex(t => document.body.classList.contains(t));
                document.body.className = themes[(current + 1) % themes.length];
                localStorage.setItem('novelhub-theme', document.body.className);
            });
        }
        
        // Toast 函数
        function showToast(msg, type) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'info');
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // 获取用户数据
        let USERS = window.MockData ? window.MockData.USERS : [];
        
        document.addEventListener('DOMContentLoaded', () => {
            initCommon();
            initForgotPasswordPage();
        });

        function initForgotPasswordPage() {
            const emailForm = document.getElementById('emailForm');
            const codeForm = document.getElementById('codeForm');
            const passwordForm = document.getElementById('passwordForm');
            const emailInput = document.getElementById('resetEmail');
            const codeInput = document.getElementById('verifyCode');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmInput = document.getElementById('confirmPassword');
            const resendBtn = document.getElementById('resendCode');
            const strengthItems = document.querySelectorAll('.strength-item');
            const strengthText = document.getElementById('strengthText');

            let currentStep = 1;
            let userEmail = '';
            let countdownTimer = null;

            // 密码显示/隐藏切换
            document.querySelectorAll('.password-toggle').forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const input = toggle.previousElementSibling;
                    const eyeOn = toggle.querySelector('.icon-eye');
                    const eyeOff = toggle.querySelector('.icon-eye-off');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        eyeOn.style.display = 'none';
                        eyeOff.style.display = 'block';
                        toggle.setAttribute('aria-label', '隐藏密码');
                    } else {
                        input.type = 'password';
                        eyeOn.style.display = 'block';
                        eyeOff.style.display = 'none';
                        toggle.setAttribute('aria-label', '显示密码');
                    }
                });
            });

            // 实时验证
            emailInput.addEventListener('blur', () => validateEmail(emailInput));
            emailInput.addEventListener('input', () => clearError(emailInput));

            codeInput.addEventListener('input', (e) => {
                clearError(codeInput);
                // 只允许数字
                e.target.value = e.target.value.replace(/\D/g, '');
            });

            newPasswordInput.addEventListener('input', (e) => {
                clearError(newPasswordInput);
                checkPasswordStrength(e.target.value);
                if (confirmInput.value) validatePasswordMatch();
            });

            confirmInput.addEventListener('input', () => {
                clearError(confirmInput);
                validatePasswordMatch();
            });

            // 步骤1：发送验证码
            emailForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                clearError(emailInput);
                
                if (!validateEmail(emailInput)) return;

                const email = emailInput.value.trim();
                
                // 显示加载状态
                setLoading('sendCodeBtn', true);

                try {
                    // 模拟API调用
                    await new Promise(resolve => setTimeout(resolve, 1000));

                    // 检查邮箱是否存在
                    const user = USERS.find(u => u.email === email);
                    if (!user) {
                        // 为了演示，允许任何邮箱继续
                        console.log('邮箱不存在，但继续演示流程');
                    }

                    userEmail = email;
                    showToast('验证码已发送，请查收', 'success');
                    
                    // 显示掩码邮箱
                    const maskedEmail = maskEmail(email);
                    document.getElementById('maskedEmail').textContent = maskedEmail;
                    
                    // 进入步骤2
                    goToStep(2);
                    startCountdown();
                } catch (error) {
                    showToast('发送失败，请稍后重试', 'error');
                } finally {
                    setLoading('sendCodeBtn', false);
                }
            });

            // 步骤2：验证验证码
            codeForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                clearError(codeInput);
                
                const code = codeInput.value.trim();
                
                if (!code) {
                    showError(codeInput, '请输入验证码');
                    return;
                }
                if (code.length !== 6) {
                    showError(codeInput, '请输入6位验证码');
                    return;
                }

                // 显示加载状态
                setLoading('verifyBtn', true);

                try {
                    // 模拟API调用
                    await new Promise(resolve => setTimeout(resolve, 800));

                    // 演示：任何6位数字都通过
                    showToast('验证成功', 'success');
                    goToStep(3);
                } catch (error) {
                    showToast('验证失败，请检查验证码', 'error');
                } finally {
                    setLoading('verifyBtn', false);
                }
            });

            // 重新发送验证码
            resendBtn.addEventListener('click', async () => {
                if (resendBtn.disabled) return;

                try {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    showToast('验证码已重新发送', 'success');
                    startCountdown();
                } catch (error) {
                    showToast('发送失败，请稍后重试', 'error');
                }
            });

            // 步骤3：重置密码
            passwordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                clearAllErrors();

                let isValid = true;
                if (!validatePassword(newPasswordInput)) isValid = false;
                if (!validatePasswordMatch()) isValid = false;

                if (!isValid) return;

                // 显示加载状态
                setLoading('resetBtn', true);

                try {
                    // 模拟API调用
                    await new Promise(resolve => setTimeout(resolve, 1200));

                    showToast('密码重置成功', 'success');
                    goToStep(4);
                } catch (error) {
                    showToast('重置失败，请稍后重试', 'error');
                } finally {
                    setLoading('resetBtn', false);
                }
            });

            // 验证函数
            function validateEmail(input) {
                const email = input.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                
                if (!email) {
                    showError(input, '请输入邮箱地址');
                    return false;
                }
                if (!emailRegex.test(email)) {
                    showError(input, '请输入有效的邮箱地址');
                    return false;
                }
                return true;
            }

            function validatePassword(input) {
                const password = input.value;
                if (!password) {
                    showError(input, '请输入新密码');
                    return false;
                }
                if (password.length < 8) {
                    showError(input, '密码长度至少8位');
                    return false;
                }
                if (!/[a-zA-Z]/.test(password)) {
                    showError(input, '密码必须包含字母');
                    return false;
                }
                if (!/\d/.test(password)) {
                    showError(input, '密码必须包含数字');
                    return false;
                }
                return true;
            }

            function validatePasswordMatch() {
                const password = newPasswordInput.value;
                const confirm = confirmInput.value;
                
                if (!confirm) {
                    showError(confirmInput, '请确认新密码');
                    return false;
                }
                if (password !== confirm) {
                    showError(confirmInput, '两次输入的密码不一致');
                    return false;
                }
                return true;
            }

            function checkPasswordStrength(password) {
                let strength = 0;

                if (password.length >= 8) strength++;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
                if (/\d/.test(password)) strength++;
                if (/[^a-zA-Z0-9]/.test(password)) strength++;
                if (password.length >= 12) strength++;

                // 更新强度条
                strengthItems.forEach((item, index) => {
                    item.classList.remove('weak', 'fair', 'good', 'strong');
                    if (index < Math.min(strength, 4)) {
                        if (strength <= 2) item.classList.add('weak');
                        else if (strength === 3) item.classList.add('fair');
                        else if (strength === 4) item.classList.add('good');
                        else item.classList.add('strong');
                    }
                });

                // 更新强度文本
                const strengthLabels = ['', '弱', '一般', '良好', '强'];
                const strengthLevel = Math.min(strength, 4);
                strengthText.textContent = password ? `密码强度：${strengthLabels[strengthLevel]}` : '';
                strengthText.className = 'strength-text';
                if (strengthLevel <= 2) strengthText.classList.add('weak');
                else if (strengthLevel === 3) strengthText.classList.add('fair');
                else if (strengthLevel >= 4) strengthText.classList.add('strong');
            }

            function goToStep(step) {
                currentStep = step;

                // 更新步骤指示器
                document.querySelectorAll('.step').forEach((s, index) => {
                    s.classList.remove('active', 'completed');
                    if (index + 1 < step) {
                        s.classList.add('completed');
                    } else if (index + 1 === step) {
                        s.classList.add('active');
                    }
                });

                // 显示对应步骤
                document.querySelectorAll('.step-container').forEach((container, index) => {
                    container.style.display = index + 1 === step ? 'block' : 'none';
                });

                // 成功页面
                if (step === 4) {
                    document.querySelector('.step-indicator').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                }

                // 清除倒计时
                if (step !== 2 && countdownTimer) {
                    clearInterval(countdownTimer);
                }
            }

            function startCountdown() {
                let seconds = 60;
                const resendText = resendBtn.querySelector('.resend-text');
                
                resendBtn.disabled = true;
                resendText.textContent = `${seconds}秒后重发`;

                if (countdownTimer) clearInterval(countdownTimer);

                countdownTimer = setInterval(() => {
                    seconds--;
                    if (seconds <= 0) {
                        clearInterval(countdownTimer);
                        resendText.textContent = '重新发送';
                        resendBtn.disabled = false;
                    } else {
                        resendText.textContent = `${seconds}秒后重发`;
                    }
                }, 1000);
            }

            function maskEmail(email) {
                const [local, domain] = email.split('@');
                const maskedLocal = local.substring(0, 2) + '***' + local.substring(local.length - 1);
                return `${maskedLocal}@${domain}`;
            }

            function showError(input, message) {
                const formGroup = input.closest('.form-group');
                const errorEl = formGroup.querySelector('.form-error');
                input.classList.add('error');
                if (errorEl) {
                    errorEl.textContent = message;
                    errorEl.style.display = 'block';
                }
            }

            function clearError(input) {
                const formGroup = input.closest('.form-group');
                const errorEl = formGroup.querySelector('.form-error');
                input.classList.remove('error');
                if (errorEl) {
                    errorEl.textContent = '';
                    errorEl.style.display = 'none';
                }
            }

            function clearAllErrors() {
                document.querySelectorAll('.form-input').forEach(input => clearError(input));
            }

            function setLoading(btnId, loading) {
                const btn = document.getElementById(btnId);
                const btnText = btn.querySelector('.btn-text');
                const btnLoading = btn.querySelector('.btn-loading');
                
                if (loading) {
                    btn.disabled = true;
                    btnText.style.display = 'none';
                    btnLoading.style.display = 'inline-flex';
                } else {
                    btn.disabled = false;
                    btnText.style.display = 'inline';
                    btnLoading.style.display = 'none';
                }
            }
        }
    </script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
        }

        .auth-sidebar {
            flex: 1;
            background: linear-gradient(135deg, var(--color-primary), #8b5cf6);
            color: white;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            margin-bottom: 4rem;
        }

        .auth-logo .logo-icon {
            width: 2.5rem;
            height: 2.5rem;
        }

        .auth-sidebar-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 480px;
            margin: 0 auto;
        }

        .auth-sidebar-title {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .auth-sidebar-desc {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .auth-features {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .auth-feature {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .auth-feature svg {
            width: 1.5rem;
            height: 1.5rem;
            flex-shrink: 0;
            margin-top: 0.25rem;
            opacity: 0.9;
        }

        .auth-feature h4 {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .auth-feature p {
            font-size: 0.875rem;
            opacity: 0.8;
        }

        .auth-main {
            width: 100%;
            max-width: 520px;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--color-bg-primary);
        }

        .auth-form-container {
            width: 100%;
        }

        .auth-header {
            margin-bottom: 1.5rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            transition: color var(--duration-fast);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        .back-link svg {
            width: 1rem;
            height: 1rem;
        }

        .auth-form-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .auth-form-subtitle {
            color: var(--color-text-secondary);
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .step-number {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: var(--color-bg-tertiary);
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all var(--duration-fast);
        }

        .step.active .step-number {
            background: var(--color-primary);
            color: white;
        }

        .step.completed .step-number {
            background: var(--color-success);
            color: white;
        }

        .step-label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }

        .step.active .step-label {
            color: var(--color-primary);
            font-weight: 500;
        }

        .step.completed .step-label {
            color: var(--color-success);
        }

        .step-line {
            flex: 1;
            height: 2px;
            background: var(--color-bg-tertiary);
            margin: 0 0.5rem;
            margin-bottom: 1.5rem;
            max-width: 60px;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            font-size: 1rem;
            transition: all var(--duration-fast);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        .form-input.error {
            border-color: var(--color-error);
            box-shadow: 0 0 0 3px var(--color-error-light);
        }

        .form-error {
            display: none;
            font-size: 0.8125rem;
            color: var(--color-error);
            margin-top: 0.375rem;
        }

        .form-hint {
            font-size: 0.8125rem;
            color: var(--color-text-muted);
            margin-top: 0.5rem;
        }

        .form-hint.success {
            color: var(--color-success);
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: var(--color-text-secondary);
        }

        .password-toggle svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        .password-strength {
            margin-top: 0.5rem;
        }

        .strength-bar {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 0.25rem;
        }

        .strength-item {
            flex: 1;
            height: 0.25rem;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-full);
            transition: background var(--duration-fast);
        }

        .strength-item.weak {
            background: var(--color-error);
        }

        .strength-item.fair {
            background: var(--color-warning);
        }

        .strength-item.good {
            background: #3b82f6;
        }

        .strength-item.strong {
            background: var(--color-success);
        }

        .strength-text {
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .strength-text.weak {
            color: var(--color-error);
        }

        .strength-text.fair {
            color: var(--color-warning);
        }

        .strength-text.strong {
            color: var(--color-success);
        }

        .code-input-group {
            display: flex;
            gap: 0.75rem;
        }

        .code-input {
            flex: 1;
            text-align: center;
            letter-spacing: 0.5em;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .btn-secondary {
            padding: 0.875rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--duration-fast);
            white-space: nowrap;
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-full {
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-loading {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 成功消息 */
        .success-message {
            text-align: center;
            padding: 2rem 0;
        }

        .success-icon {
            width: 5rem;
            height: 5rem;
            background: var(--color-success-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .success-icon svg {
            width: 2.5rem;
            height: 2.5rem;
            color: var(--color-success);
        }

        .success-message h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .success-message p {
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
        }

        @media (max-width: 1024px) {
            .auth-sidebar {
                display: none;
            }

            .auth-main {
                max-width: 100%;
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .step-indicator {
                padding: 0;
            }

            .step-label {
                font-size: 0.625rem;
            }

            .code-input-group {
                flex-direction: column;
            }

            .btn-secondary {
                width: 100%;
            }
        }
    </style>
</body>
</html>
