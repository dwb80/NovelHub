<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作者详情 - NovelHub</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/themes.css">
<style>
.author-page { padding: 2rem 0; }
.author-header { display: flex; gap: 2rem; margin-bottom: 3rem; padding: 2rem; background: var(--color-bg-elevated); border-radius: var(--radius-xl); border: 1px solid var(--color-border); }
.author-avatar { width: 120px; height: 120px; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5rem; font-weight: 700; flex-shrink: 0; }
.author-info { flex: 1; }
.author-name { font-size: 1.75rem; font-weight: 700; color: var(--color-text-primary); margin-bottom: 0.5rem; }
.author-bio { font-size: 0.9375rem; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 1rem; }
.author-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.author-tag { padding: 0.25rem 0.75rem; font-size: 0.75rem; background: var(--color-bg-tertiary); color: var(--color-text-secondary); border-radius: var(--radius-full); }
.author-actions { display: flex; gap: 0.75rem; }
.btn-follow { padding: 0.625rem 1.5rem; font-size: 0.9375rem; font-weight: 600; background: var(--color-primary); color: white; border: none; border-radius: var(--radius-lg); cursor: pointer; transition: background 0.2s; }
.btn-follow:hover { background: var(--color-primary-hover); }
.btn-message { padding: 0.625rem 1.5rem; font-size: 0.9375rem; font-weight: 600; background: var(--color-bg-tertiary); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: var(--radius-lg); cursor: pointer; transition: all 0.2s; }
.btn-message:hover { background: var(--color-bg-secondary); }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
.stat-card { padding: 1.5rem; background: var(--color-bg-elevated); border-radius: var(--radius-lg); border: 1px solid var(--color-border); text-align: center; }
.stat-value { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); margin-bottom: 0.25rem; }
.stat-label { font-size: 0.8125rem; color: var(--color-text-muted); }
.section-title { font-size: 1.25rem; font-weight: 600; color: var(--color-text-primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
.work-card { display: flex; flex-direction: column; background: var(--color-bg-elevated); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--color-border); transition: all 0.2s; text-decoration: none; }
.work-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--color-primary); }
.work-cover { width: 100%; aspect-ratio: 3/4; overflow: hidden; position: relative; }
.work-cover img { width: 100%; height: 100%; object-fit: cover; }
.work-badges { position: absolute; top: 0.5rem; left: 0.5rem; display: flex; flex-direction: column; gap: 0.25rem; }
.work-badge { padding: 0.125rem 0.375rem; font-size: 0.6875rem; font-weight: 600; border-radius: var(--radius-sm); }
.work-badge.hot { background: var(--color-error); color: white; }
.work-badge.new { background: var(--color-success); color: white; }
.work-info { padding: 1rem; }
.work-title { font-weight: 600; font-size: 0.9375rem; color: var(--color-text-primary); margin-bottom: 0.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-stats { font-size: 0.75rem; color: var(--color-text-muted); }
.work-status { display: inline-block; padding: 0.125rem 0.5rem; font-size: 0.75rem; border-radius: var(--radius-full); margin-top: 0.5rem; }
.work-status.serializing { background: var(--color-warning-light); color: var(--color-warning); }
.work-status.completed { background: var(--color-success-light); color: var(--color-success); }
.sidebar { display: grid; grid-template-columns: 1fr 300px; gap: 2rem; }
@media (max-width: 1024px) { .sidebar { grid-template-columns: 1fr; } }
@media (max-width: 768px) { .author-header { flex-direction: column; align-items: center; text-align: center; } .stats-grid { grid-template-columns: repeat(2, 1fr); } .works-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; } }
</style>
</head>
<body class="theme-light">
<div id="app" class="app-container">
<header class="navbar"><div class="navbar-inner"><a href="../../index.html" class="logo"><span class="logo-text">NovelHub</span></a><nav class="nav-menu"><a href="../../index.html" class="nav-link">首页</a><a href="../discover/category.html" class="nav-link">分类</a><a href="../discover/ranking/index.html" class="nav-link">排行</a><a href="../bookshelf/my-bookshelf.html" class="nav-link">书架</a></nav></div></header>
<main class="main-content"><div class="container">
<div class="author-page">
<div class="author-header">
<div class="author-avatar" id="authorAvatar">张</div>
<div class="author-info">
<h1 class="author-name" id="authorName">加载中...</h1>
<p class="author-bio" id="authorBio"></p>
<div class="author-tags" id="authorTags"></div>
<div class="author-actions">
<button class="btn-follow" id="followBtn">关注</button>
<button class="btn-message">发消息</button>
</div>
</div>
</div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="workCount">0</div><div class="stat-label">作品数</div></div>
<div class="stat-card"><div class="stat-value" id="totalWords">0</div><div class="stat-label">总字数</div></div>
<div class="stat-card"><div class="stat-value" id="fansCount">0</div><div class="stat-label">粉丝数</div></div>
<div class="stat-card"><div class="stat-value" id="avgRating">0.0</div><div class="stat-label">平均评分</div></div>
</div>
<div class="sidebar">
<div class="main-content-area">
<section><h2 class="section-title">作者作品</h2><div class="works-grid" id="worksGrid"></div></section>
</div>
<aside>
<div class="sidebar-card"><h3 class="sidebar-title">作者动态</h3><div class="activity-list" id="activityList"></div></div>
</aside>
</div>
</div>
</div></main>
<footer class="footer"><div class="container"><p>&copy; 2026 NovelHub</p></div></footer>
</div>
<script src="../../assets/js/mock/data-global.js"></script>

<!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->
<script src="../../assets/js/fixes/index.js"></script>

<script>
var NOVELS;
var currentAuthor = null;
document.addEventListener('DOMContentLoaded', function() {
    NOVELS = window.MockData.NOVELS;
    var urlParams = new URLSearchParams(window.location.search);
    var authorId = urlParams.get('id') || '1';
    loadAuthor(authorId);
});
function loadAuthor(id) {
    var mockAuthors = [
        { id: '1', name: '张三', bio: '知名网络小说作家，擅长玄幻仙侠题材创作，累计创作字数超过500万。作品风格大气磅礴，情节跌宕起伏，深受读者喜爱。', tags: ['玄幻', '仙侠', '热血'], fans: 125680, works: 8, totalWords: 5680000, avgRating: 9.2 },
        { id: '2', name: '李四', bio: '都市异能小说作家，文字细腻，情节设置巧妙。', tags: ['都市', '异能', '爽文'], fans: 89650, works: 5, totalWords: 3200000, avgRating: 8.8 },
        { id: '3', name: '王五', bio: '科幻小说新锐，文笔独特，想象力丰富。', tags: ['科幻', '未来', '悬疑'], fans: 45630, works: 3, totalWords: 1800000, avgRating: 8.5 }
    ];
    currentAuthor = mockAuthors.find(function(a) { return a.id === id; }) || mockAuthors[0];
    renderAuthorInfo();
    renderWorks();
    renderActivities();
}
function renderAuthorInfo() {
    document.getElementById('authorAvatar').textContent = currentAuthor.name.slice(-1);
    document.getElementById('authorName').textContent = currentAuthor.name;
    document.getElementById('authorBio').textContent = currentAuthor.bio;
    document.getElementById('authorTags').innerHTML = currentAuthor.tags.map(function(t) { return '<span class="author-tag">' + t + '</span>'; }).join('');
    document.getElementById('workCount').textContent = currentAuthor.works;
    document.getElementById('totalWords').textContent = formatNumber(currentAuthor.totalWords);
    document.getElementById('fansCount').textContent = formatNumber(currentAuthor.fans);
    document.getElementById('avgRating').textContent = currentAuthor.avgRating.toFixed(1);
}
function renderWorks() {
    var container = document.getElementById('worksGrid');
    var authorWorks = NOVELS.filter(function(n) { return n.author.includes(currentAuthor.name.slice(0, 1)); }).slice(0, 8);
    if(authorWorks.length === 0) authorWorks = NOVELS.slice(0, 8);
    container.innerHTML = authorWorks.map(function(n) {
        var badges = '';
        if(n.isHot) badges += '<span class="work-badge hot">热门</span>';
        if(n.isNew) badges += '<span class="work-badge new">新书</span>';
        var statusClass = n.status === 'completed' ? 'completed' : 'serializing';
        var statusText = n.status === 'completed' ? '已完结' : '连载中';
        return '<a href="../novel/detail.html?id=' + n.id + '" class="work-card"><div class="work-cover"><img src="' + n.cover + '" alt="' + n.title + '"><div class="work-badges">' + badges + '</div></div><div class="work-info"><h3 class="work-title">' + n.title + '</h3><div class="work-stats"><span>' + n.category + '</span> · <span>' + formatNumber(n.wordCount) + '字</span></div><span class="work-status ' + statusClass + '">' + statusText + '</span></div></a>';
    }).join('');
}
function renderActivities() {
    var container = document.getElementById('activityList');
    var activities = [
        { time: '2小时前', text: '发布了新章节《第125章 惊天秘密》' },
        { time: '1天前', text: '《星辰变》更新至第500章' },
        { time: '3天前', text: '回复了读者的评论' },
        { time: '1周前', text: '发布了新书《剑道至尊》' }
    ];
    container.innerHTML = activities.map(function(a) { return '<div class="activity-item"><span class="activity-time">' + a.time + '</span><p class="activity-text">' + a.text + '</p></div>'; }).join('');
}
function formatNumber(num) {
    if(num >= 10000) return (num / 10000).toFixed(1) + '万';
    return num.toString();
}
document.getElementById('followBtn').addEventListener('click', function() {
    if(this.textContent === '关注') { this.textContent = '已关注'; this.style.background = 'var(--color-bg-tertiary)'; this.style.color = 'var(--color-text-secondary)'; } else { this.textContent = '关注'; this.style.background = 'var(--color-primary)'; this.style.color = 'white'; }
});
</script>
</body>
</html>
