<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索结果 - NovelHub</title>
<link rel="stylesheet" href="../../../assets/css/base.css">
<link rel="stylesheet" href="../../../assets/css/components.css">
<link rel="stylesheet" href="../../../assets/css/layout.css">
<link rel="stylesheet" href="../../../assets/css/themes.css">
<style>
.search-results-page { padding: 2rem 0; }
.search-box-container { max-width: 600px; margin: 0 auto 1.5rem; }
.search-box { display: flex; gap: 0.5rem; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: 0.5rem; }
.search-input { flex: 1; border: none; background: transparent; padding: 0.75rem 1rem; font-size: 1rem; color: var(--color-text-primary); outline: none; }
.search-btn { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: var(--color-primary); color: white; border: none; border-radius: var(--radius-lg); cursor: pointer; }
.search-info { text-align: center; margin-bottom: 2rem; }
.search-keyword { font-size: 1.25rem; font-weight: 600; color: var(--color-text-primary); margin-bottom: 0.5rem; }
.search-count { font-size: 0.875rem; color: var(--color-text-secondary); }
.search-count span { color: var(--color-primary); font-weight: 600; }
.filter-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: var(--color-bg-elevated); border-radius: var(--radius-lg); border: 1px solid var(--color-border); flex-wrap: wrap; }
.filter-group { display: flex; flex-direction: column; gap: 0.5rem; }
.filter-label { font-size: 0.75rem; font-weight: 600; color: var(--color-text-muted); }
.filter-options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.filter-option { padding: 0.375rem 0.75rem; font-size: 0.8125rem; color: var(--color-text-secondary); background: var(--color-bg-tertiary); border-radius: var(--radius-full); cursor: pointer; border: 1px solid transparent; }
.filter-option.active { color: var(--color-primary); background: var(--color-primary-light); border-color: var(--color-primary); }
.sort-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--color-border); }
.sort-options { display: flex; gap: 0.5rem; }
.sort-option { padding: 0.5rem 1rem; font-size: 0.875rem; color: var(--color-text-secondary); background: transparent; border-radius: var(--radius-md); cursor: pointer; border: none; }
.sort-option.active { color: var(--color-primary); background: var(--color-primary-light); }
.results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
.result-card { display: flex; flex-direction: column; background: var(--color-bg-elevated); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--color-border); transition: all 0.2s; text-decoration: none; }
.result-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--color-primary); }
.result-cover { width: 100%; aspect-ratio: 3/4; overflow: hidden; position: relative; }
.result-cover img { width: 100%; height: 100%; object-fit: cover; }
.result-badges { position: absolute; top: 0.5rem; left: 0.5rem; display: flex; flex-direction: column; gap: 0.25rem; }
.result-badge { padding: 0.125rem 0.375rem; font-size: 0.6875rem; font-weight: 600; border-radius: var(--radius-sm); }
.result-badge.hot { background: var(--color-error); color: white; }
.result-badge.new { background: var(--color-success); color: white; }
.result-badge.completed { background: var(--color-info); color: white; }
.result-info { padding: 1rem; }
.result-title { font-weight: 600; font-size: 0.9375rem; color: var(--color-text-primary); margin-bottom: 0.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-author { font-size: 0.8125rem; color: var(--color-text-muted); margin-bottom: 0.5rem; }
.result-stats { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--color-text-secondary); }
.result-rating { display: flex; align-items: center; gap: 0.25rem; color: var(--color-warning); }
.empty-state { text-align: center; padding: 4rem 2rem; }
.empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
.empty-title { font-size: 1.25rem; color: var(--color-text-secondary); margin-bottom: 0.5rem; }
.empty-desc { color: var(--color-text-muted); margin-bottom: 1.5rem; }
.recommend-section { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--color-border); }
.recommend-title { font-size: 1.125rem; font-weight: 600; color: var(--color-text-primary); margin-bottom: 1rem; }
.recommend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
@media (max-width: 768px) { .results-grid, .recommend-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; } .filter-bar { flex-direction: column; } }
</style>
</head>
<body class="theme-light">
<div id="app" class="app-container">
<header class="navbar"><div class="navbar-inner"><a href="../../../index.html" class="logo"><span class="logo-text">NovelHub</span></a><nav class="nav-menu"><a href="../../../index.html" class="nav-link">首页</a><a href="../category.html" class="nav-link">分类</a><a href="../ranking/index.html" class="nav-link">排行</a><a href="../../bookshelf/my-bookshelf.html" class="nav-link">书架</a></nav></div></header>
<main class="main-content"><div class="container"><div class="search-results-page">
<div class="search-header">
<div class="search-box-container"><form class="search-box" onsubmit="return false;"><input type="text" class="search-input" id="searchInput" placeholder="搜索小说、作者..."><button type="submit" class="search-btn">搜</button></form></div>
<div class="search-info"><p class="search-keyword" id="searchKeyword">搜索关键词</p><p class="search-count">共 <span id="resultCount">0</span> 个结果</p></div>
</div>
<div class="filter-bar" id="filterBar">
<div class="filter-group"><span class="filter-label">分类</span><div class="filter-options" id="categoryFilters"><span class="filter-option active" data-category="all">全部</span></div></div>
<div class="filter-group"><span class="filter-label">状态</span><div class="filter-options"><span class="filter-option active" data-status="all">全部</span><span class="filter-option" data-status="serializing">连载中</span><span class="filter-option" data-status="completed">已完结</span></div></div>
<div class="filter-group"><span class="filter-label">字数</span><div class="filter-options"><span class="filter-option active" data-wordcount="all">全部</span><span class="filter-option" data-wordcount="short">100万以下</span><span class="filter-option" data-wordcount="medium">100-300万</span><span class="filter-option" data-wordcount="long">300万以上</span></div></div></div>
<div class="sort-bar"><span class="sort-label">排序方式：</span><div class="sort-options"><button class="sort-option active" data-sort="relevance">相关度</button><button class="sort-option" data-sort="hot">热度</button><button class="sort-option" data-sort="rating">评分</button><button class="sort-option" data-sort="latest">最新</button></div></div>
<div class="results-grid" id="resultsGrid"></div>
<div class="empty-state" id="emptyState" style="display:none;"><div class="empty-icon">📚</div><h3 class="empty-title">未找到相关小说</h3><p class="empty-desc">换个关键词试试，或者浏览我们的热门推荐</p></div>
<div class="recommend-section" id="recommendSection"><h3 class="recommend-title">热门推荐</h3><div class="recommend-grid" id="recommendGrid"></div></div>
</div></div></main>
<footer class="footer"><div class="container"><p>&copy; 2026 NovelHub</p></div></footer>
</div>
<script src="../../../assets/js/mock/data-global.js"></script>
<script>
var CATEGORIES, NOVELS;
var currentKeyword = '';
var currentCategory = 'all';
var currentStatus = 'all';
var currentWordCount = 'all';
var currentSort = 'relevance';
document.addEventListener('DOMContentLoaded', function() {
    CATEGORIES = window.MockData.CATEGORIES;
    NOVELS = window.MockData.NOVELS;
    var urlParams = new URLSearchParams(window.location.search);
    currentKeyword = urlParams.get('q') || '玄幻';
    document.getElementById('searchInput').value = currentKeyword;
    document.getElementById('searchKeyword').textContent = '「' + currentKeyword + '」';
    renderCategoryFilters();
    renderResults();
    renderRecommendations();
    initEventListeners();
});
function initEventListeners() {
    document.querySelectorAll('.filter-option').forEach(function(opt) {
        opt.addEventListener('click', function() {
            var parent = this.parentElement;
            parent.querySelectorAll('.filter-option').forEach(function(o) { o.classList.remove('active'); });
            this.classList.add('active');
            if(this.dataset.category) currentCategory = this.dataset.category;
            else if(this.dataset.status) currentStatus = this.dataset.status;
            else if(this.dataset.wordcount) currentWordCount = this.dataset.wordcount;
            renderResults();
        });
    });
    document.querySelectorAll('.sort-option').forEach(function(opt) {
        opt.addEventListener('click', function() {
            document.querySelectorAll('.sort-option').forEach(function(o) { o.classList.remove('active'); });
            this.classList.add('active');
            currentSort = this.dataset.sort;
            renderResults();
        });
    });
}
function renderCategoryFilters() {
    var container = document.getElementById('categoryFilters');
    var html = '<span class="filter-option active" data-category="all">全部</span>';
    CATEGORIES.slice(0, 6).forEach(function(c) {
        html += '<span class="filter-option" data-category="' + c.name + '">' + c.name + '</span>';
    });
    container.innerHTML = html;
}
function renderResults() {
    var filtered = NOVELS.filter(function(n) {
        return n.title.includes(currentKeyword) || n.author.includes(currentKeyword) || n.tags.some(function(t) { return t.includes(currentKeyword); });
    });
    if(currentCategory !== 'all') filtered = filtered.filter(function(n) { return n.category === currentCategory; });
    if(currentStatus === 'serializing') filtered = filtered.filter(function(n) { return n.is_serializing; });
    else if(currentStatus === 'completed') filtered = filtered.filter(function(n) { return !n.is_serializing; });
    if(currentWordCount === 'short') filtered = filtered.filter(function(n) { return n.wordCount < 1000000; });
    else if(currentWordCount === 'medium') filtered = filtered.filter(function(n) { return n.wordCount >= 1000000 && n.wordCount < 3000000; });
    else if(currentWordCount === 'long') filtered = filtered.filter(function(n) { return n.wordCount >= 3000000; });
    if(currentSort === 'hot') filtered.sort(function(a, b) { return b.todayViews - a.todayViews; });
    else if(currentSort === 'rating') filtered.sort(function(a, b) { return b.rating - a.rating; });
    document.getElementById('resultCount').textContent = filtered.length;
    var grid = document.getElementById('resultsGrid');
    var empty = document.getElementById('emptyState');
    if(filtered.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
    } else {
        grid.style.display = 'grid';
        empty.style.display = 'none';
        var html = '';
        filtered.slice(0, 20).forEach(function(n) {
            var badges = '';
            if(n.isHot) badges += '<span class="result-badge hot">热门</span>';
            if(n.isNew) badges += '<span class="result-badge new">新书</span>';
            if(n.status === 'completed') badges += '<span class="result-badge completed">完结</span>';
            html += '<a href="../novel/detail.html?id=' + n.id + '" class="result-card"><div class="result-cover"><img src="' + n.cover + '" alt="' + n.title + '"><div class="result-badges">' + badges + '</div></div><div class="result-info"><h3 class="result-title">' + n.title + '</h3><p class="result-author">' + n.author + '</p><div class="result-stats"><span>' + n.category + '</span><span class="result-rating">' + n.rating + '分</span></div></div></a>';
        });
        grid.innerHTML = html;
    }
}
function renderRecommendations() {
    var grid = document.getElementById('recommendGrid');
    var hot = NOVELS.filter(function(n) { return n.isHot; }).slice(0, 6);
    var html = '';
    hot.forEach(function(n) {
        html += '<a href="../novel/detail.html?id=' + n.id + '" class="result-card"><div class="result-cover"><img src="' + n.cover + '" alt="' + n.title + '"></div><div class="result-info"><h3 class="result-title">' + n.title + '</h3><p class="result-author">' + n.author + '</p></div></a>';
    });
    grid.innerHTML = html;
}
</script>

<!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->

</body>
</html>
