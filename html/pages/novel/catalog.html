    <!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->
    <script src="../../assets/js/fixes/index.js"></script>
    
    <script>
        // 全局函数定义
        let initCommon, showToast;
        
        initCommon = function() {
            const saved = localStorage.getItem('novelhub-theme');
            if (saved) document.body.className = saved;
            const toggle = document.getElementById('themeToggle');
            if (toggle) toggle.addEventListener('click', () => {
                const themes = ['theme-light', 'theme-paper', 'theme-dark', 'theme-eye-care'];
                const current = themes.findIndex(t => document.body.classList.contains(t));
                document.body.className = themes[(current + 1) % themes.length];
                localStorage.setItem('novelhub-theme', document.body.className);
            });
        };
        
        showToast = function(msg, type) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'info');
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        // 数据变量
        let NOVELS, CHAPTERS, READING_HISTORY;
        let currentNovel = null;
        let allChapters = [];
        let filteredChapters = [];
        let currentPage = 1;
        let pageSize = 20;
        let isAscending = true;
        
        // 初始化数据
        function initData() {
            if (window.MockData) {
                NOVELS = window.MockData.NOVELS || [];
                CHAPTERS = window.MockData.CHAPTERS || [];
                READING_HISTORY = window.MockData.READING_HISTORY || [];
            } else if (window.NOVELS) {
                NOVELS = window.NOVELS || [];
                CHAPTERS = window.CHAPTERS || [];
                READING_HISTORY = window.READING_HISTORY || [];
            } else {
                console.error('无法找到数据');
                NOVELS = [];
                CHAPTERS = [];
                READING_HISTORY = [];
            }
        }
        let currentFilter = 'all';
        let lastReadChapter = null;

        // 格式化字数
        function formatWordCount(count) {
            if (count >= 10000) {
                return (count / 10000).toFixed(1) + '万';
            }
            return count.toString();
        }

        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN');
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'completed': '已完结',
                'published': '连载中',
                'draft': '草稿'
            };
            return statusMap[status] || status;
        }

        // 获取状态样式类
        function getStatusClass(status) {
            const classMap = {
                'completed': 'badge-success',
                'published': 'badge-primary',
                'draft': 'badge-warning'
            };
            return classMap[status] || 'badge-secondary';
        }

        // 渲染头部
        function renderHeader() {
            const header = document.getElementById('catalogHeader');
            const statusText = getStatusText(currentNovel.status);
            const statusClass = getStatusClass(currentNovel.status);

            header.innerHTML = `
                <div class="catalog-novel-info">
                    <div class="catalog-cover">
                        <img src="${currentNovel.cover}" alt="${currentNovel.title}" loading="lazy">
                    </div>
                    <div class="catalog-novel-meta">
                        <div class="catalog-title-row">
                            <h1 class="catalog-title">${currentNovel.title}</h1>
                            <span class="badge ${statusClass}">${statusText}</span>
                        </div>
                        <p class="catalog-author">
                            <span class="author-label">作者：</span>
                            <a href="detail.html?novel=${currentNovel.id}" class="author-name">${currentNovel.author}</a>
                        </p>
                        <div class="catalog-tags">
                            <span class="tag">${currentNovel.category}</span>
                            ${currentNovel.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="catalog-stats">
                            <span class="catalog-stat">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                </svg>
                                ${formatWordCount(currentNovel.wordCount)}字
                            </span>
                            <span class="catalog-stat">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                                ${currentNovel.chapterCount}章
                            </span>
                            <span class="catalog-stat">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                                </svg>
                                ${currentNovel.rating}分
                            </span>
                            <span class="catalog-stat">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                ${formatWordCount(currentNovel.view_count)}阅读
                            </span>
                        </div>
                    </div>
                </div>
                <div class="catalog-actions">
                    <button class="btn-primary" id="continueReadingBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                        ${lastReadChapter ? '继续阅读' : '开始阅读'}
                    </button>
                    <button class="btn-secondary" id="favoriteBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        收藏
                    </button>
                    <a href="detail.html?novel=${currentNovel.id}" class="btn-secondary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        详情
                    </a>
                </div>
            `;

            // 绑定按钮事件
            document.getElementById('continueReadingBtn').addEventListener('click', () => {
                if (lastReadChapter) {
                    window.location.href = `../reader/reading.html?novel=${currentNovel.id}&chapter=${lastReadChapter.chapter_id}`;
                } else if (filteredChapters.length > 0) {
                    const firstChapter = isAscending ? filteredChapters[0] : filteredChapters[filteredChapters.length - 1];
                    window.location.href = `../reader/reading.html?novel=${currentNovel.id}&chapter=${firstChapter.id}`;
                }
            });

            document.getElementById('favoriteBtn').addEventListener('click', function() {
                this.classList.toggle('active');
                const isActive = this.classList.contains('active');
                showToast(isActive ? '已添加到书架' : '已取消收藏', isActive ? 'success' : 'info');
            });
        }

        // 渲染章节列表
        function renderChapterList() {
            const list = document.getElementById('catalogList');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageChapters = filteredChapters.slice(start, end);

            if (pageChapters.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无章节</div>';
                return;
            }

            list.innerHTML = pageChapters.map((chapter, index) => {
                const isRead = lastReadChapter && lastReadChapter.order_index >= chapter.order_index;
                const isLocked = chapter.isVip;
                const statusClass = chapter.status === 'published' ? 'badge-success' : 'badge-warning';
                const statusText = chapter.status === 'published' ? '已发布' : '待发布';
                const actualIndex = isAscending ? start + index + 1 : filteredChapters.length - start - index;

                return `
                    <div class="chapter-item ${isRead ? 'read' : ''} ${isLocked ? 'vip' : ''}" data-index="${chapter.order_index}" data-id="${chapter.id}">
                        <div class="chapter-number">第${chapter.order_index}章</div>
                        <div class="chapter-content">
                            <h3 class="chapter-title">${chapter.title.replace(/^第\d+章\s*/, '')}</h3>
                            <div class="chapter-meta">
                                <span class="chapter-words">${formatWordCount(chapter.word_count)}字</span>
                                <span class="chapter-date">${formatDate(chapter.published_at || chapter.created_at)}</span>
                                ${isLocked ? '<span class="chapter-status badge-primary">VIP</span>' : `<span class="chapter-status ${statusClass}">${statusText}</span>`}
                            </div>
                        </div>
                        ${isRead ? '<span class="chapter-read-mark">已读</span>' : ''}
                        <button class="btn-icon chapter-read-btn" title="阅读" ${chapter.status === 'draft' ? 'disabled' : ''} data-chapter="${chapter.id}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                            </svg>
                        </button>
                    </div>
                `;
            }).join('');

            // 绑定阅读按钮事件
            list.querySelectorAll('.chapter-read-btn:not([disabled])').forEach(btn => {
                btn.addEventListener('click', () => {
                    const chapterId = btn.dataset.chapter;
                    window.location.href = `../reader/reading.html?novel=${currentNovel.id}&chapter=${chapterId}`;
                });
            });

            // 点击整行也可以跳转
            list.querySelectorAll('.chapter-item').forEach(item => {
                if (!item.classList.contains('vip')) {
                    item.addEventListener('click', (e) => {
                        if (!e.target.closest('.chapter-read-btn')) {
                            const chapterId = item.dataset.id;
                            window.location.href = `../reader/reading.html?novel=${currentNovel.id}&chapter=${chapterId}`;
                        }
                    });
                }
            });
        }

        // 渲染分页
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredChapters.length / pageSize);

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} id="prevPage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            `;

            // 页码按钮
            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);

            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            if (startPage > 1) {
                html += `<button class="page-btn" data-page="1">1</button>`;
                if (startPage > 2) {
                    html += `<span class="page-ellipsis">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    html += `<span class="page-ellipsis">...</span>`;
                }
                html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
            }

            html += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} id="nextPage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            `;

            pagination.innerHTML = html;

            // 绑定分页事件
            pagination.querySelectorAll('.page-btn[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.dataset.page);
                    renderChapterList();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });

            document.getElementById('prevPage')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderChapterList();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('nextPage')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderChapterList();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        // 过滤章节
        function filterChapters() {
            filteredChapters = allChapters.filter(chapter => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'published') return chapter.status === 'published';
                if (currentFilter === 'vip') return chapter.isVip;
                return true;
            });

            // 排序
            filteredChapters.sort((a, b) => {
                return isAscending ? a.order_index - b.order_index : b.order_index - a.order_index;
            });

            // 更新总数显示
            document.getElementById('totalChapters').textContent = filteredChapters.length;

            // 重置到第一页
            currentPage = 1;

            renderChapterList();
            renderPagination();
        }

        // 跳转章节
        function jumpToChapter() {
            const input = document.getElementById('jumpInput');
            const chapterNum = parseInt(input.value);

            if (!chapterNum || chapterNum < 1 || chapterNum > allChapters.length) {
                showToast(`请输入有效的章节号 (1-${allChapters.length})`, 'warning');
                return;
            }

            const targetChapter = allChapters.find(c => c.order_index === chapterNum);
            if (targetChapter) {
                // 计算目标章节在哪一页
                const targetIndex = filteredChapters.findIndex(c => c.id === targetChapter.id);
                if (targetIndex === -1) {
                    showToast('该章节在当前筛选条件下不可用', 'warning');
                    return;
                }

                currentPage = Math.floor(targetIndex / pageSize) + 1;
                renderChapterList();
                renderPagination();

                // 高亮目标章节
                setTimeout(() => {
                    const targetItem = document.querySelector(`.chapter-item[data-index="${chapterNum}"]`);
                    if (targetItem) {
                        targetItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        targetItem.classList.add('highlight');
                        setTimeout(() => targetItem.classList.remove('highlight'), 2000);
                    }
                }, 100);
            }

            input.value = '';
        }

        // 初始化页面
        function initPage() {
            // 从URL获取小说ID（支持 'novel' 和 'id' 两种参数名）
            const urlParams = new URLSearchParams(window.location.search);
            const novelId = urlParams.get('novel') || urlParams.get('id') || NOVELS[0].id;

            // 查找小说数据
            currentNovel = NOVELS.find(n => n.id === novelId) || NOVELS[0];

            // 获取该小说的章节
            allChapters = CHAPTERS.filter(c => c.novel_id === currentNovel.id);

            // 获取阅读进度
            const history = READING_HISTORY.find(h => h.novel_id === currentNovel.id);
            if (history) {
                lastReadChapter = {
                    chapter_id: history.chapter_id,
                    order_index: history.chapterId,
                    title: history.chapterTitle
                };
            }

            // 更新页面标题
            document.title = `目录 - ${currentNovel.title} | NovelHub`;

            // 更新跳转输入框的最大值
            document.getElementById('jumpInput').max = allChapters.length;

            // 渲染页面
            renderHeader();
            filterChapters();

            // 更新阅读进度显示
            if (lastReadChapter) {
                const progress = Math.round((lastReadChapter.order_index / allChapters.length) * 100);
                document.getElementById('readProgress').textContent = `已读 ${progress}%`;
            }
        }

        // 更新排序按钮的 aria-pressed 状态
        function updateSortButtonAria() {
            const sortAsc = document.getElementById('sortAsc');
            const sortDesc = document.getElementById('sortDesc');
            sortAsc.setAttribute('aria-pressed', isAscending ? 'true' : 'false');
            sortDesc.setAttribute('aria-pressed', isAscending ? 'false' : 'true');
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            initData(); // 初始化数据
            initCommon();
            initPage();

            // 绑定排序按钮
            document.getElementById('sortAsc').addEventListener('click', () => {
                isAscending = true;
                document.getElementById('sortAsc').classList.add('active');
                document.getElementById('sortDesc').classList.remove('active');
                updateSortButtonAria();
                filterChapters();
            });

            document.getElementById('sortDesc').addEventListener('click', () => {
                isAscending = false;
                document.getElementById('sortDesc').classList.add('active');
                document.getElementById('sortAsc').classList.remove('active');
                updateSortButtonAria();
                filterChapters();
            });

            // 绑定筛选器
            document.getElementById('statusFilter').addEventListener('change', (e) => {
                currentFilter = e.target.value;
                filterChapters();
            });

            // 绑定跳转按钮
            document.getElementById('jumpBtn').addEventListener('click', jumpToChapter);

            document.getElementById('jumpInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    jumpToChapter();
                }
            });

            // 隐藏页面加载器
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.classList.add('hidden');
                }
            }, 500);
        });
