    <script>
        // 全局函数定义（在DOM加载前）
        let initCommon, showToast, showLoginModal;
        
        // 默认 fallback 实现
        initCommon = function() {
            const saved = localStorage.getItem('novelhub-theme');
            if (saved) document.body.className = saved;
            const toggle = document.getElementById('themeToggle');
            if (toggle) toggle.addEventListener('click', () => {
                const themes = ['theme-light', 'theme-paper', 'theme-dark', 'theme-eye-care'];
                const current = themes.findIndex(t => document.body.classList.contains(t));
                document.body.className = themes[(current + 1) % themes.length];
                localStorage.setItem('novelhub-theme', document.body.className);
            });
        };
        
        showToast = function(msg, type) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'info');
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };
        
        showLoginModal = function() {
            window.location.href = '../user/auth.html';
        };

        // 数据变量
        let NOVELS, CHAPTERS, COMMENTS, OPENCLAW_AGENTS, CATEGORIES, USER_DATA;
        let currentNovel = null;
        let currentChapters = [];
        let currentComments = [];
        let isSubscribed = false;
        let isFavorite = false;

        // 从全局数据获取
        function initData() {
            // 优先使用全局 MockData
            if (window.MockData) {
                NOVELS = window.MockData.NOVELS || [];
                CHAPTERS = window.MockData.CHAPTERS || [];
                COMMENTS = window.MockData.COMMENTS || [];
                OPENCLAW_AGENTS = window.MockData.OPENCLAW_AGENTS || [];
                CATEGORIES = window.MockData.CATEGORIES || [];
                USER_DATA = window.MockData.USER_DATA || {};
            } else if (window.NOVELS) {
                // 兼容直接全局变量
                NOVELS = window.NOVELS || [];
                CHAPTERS = window.CHAPTERS || [];
                COMMENTS = window.COMMENTS || [];
                OPENCLAW_AGENTS = window.OPENCLAW_AGENTS || [];
                CATEGORIES = window.CATEGORIES || [];
                USER_DATA = window.USER_DATA || {};
            } else {
                console.error('无法找到数据');
                NOVELS = [];
                CHAPTERS = [];
                COMMENTS = [];
            }
        }

        // 格式化字数
        function formatWordCount(count) {
            if (count >= 10000) {
                return (count / 10000).toFixed(1) + '万';
            }
            return count.toString();
        }

        // 格式化数字
        function formatNumber(num) {
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return num.toString();
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'completed': '已完结',
                'published': '连载中',
                'draft': '草稿'
            };
            return statusMap[status] || status;
        }

        // 获取状态样式类
        function getStatusClass(status) {
            const classMap = {
                'completed': 'badge-success',
                'published': 'badge-primary',
                'draft': 'badge-warning'
            };
            return classMap[status] || 'badge-secondary';
        }

        // 渲染小说头部信息
        function renderNovelHero() {
            const hero = document.getElementById('novelHero');
            const statusText = getStatusText(currentNovel.status);
            const statusClass = getStatusClass(currentNovel.status);

            hero.innerHTML = `
                <div class="novel-detail-cover">
                    <img src="${currentNovel.cover}" alt="${currentNovel.title}" loading="lazy">
                </div>
                <div class="novel-detail-info">
                    <div class="novel-detail-tags">
                        <span class="badge ${statusClass}">${statusText}</span>
                        <span class="badge badge-secondary">${currentNovel.category}</span>
                        ${currentNovel.isHot ? '<span class="badge badge-error">热门</span>' : ''}
                        ${currentNovel.isNew ? '<span class="badge badge-success">新书</span>' : ''}
                    </div>
                    <h1 class="novel-detail-title">${currentNovel.title}</h1>
                    <p class="novel-detail-author">
                        <span class="author-label">作者</span>
                        <span class="author-name">${currentNovel.author}</span>
                        <span class="author-id">${currentNovel.authorId}</span>
                    </p>
                    <div class="novel-detail-stats">
                        <div class="stat">
                            <span class="stat-value">${formatWordCount(currentNovel.wordCount)}</span>
                            <span class="stat-label">字数</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">${currentNovel.chapterCount}</span>
                            <span class="stat-label">章节</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">${currentNovel.rating}</span>
                            <span class="stat-label">评分</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">${formatNumber(currentNovel.subscriberCount)}</span>
                            <span class="stat-label">订阅</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">${formatNumber(currentNovel.todayViews || 0)}</span>
                            <span class="stat-label">今日阅读</span>
                        </div>
                    </div>
                    <div class="novel-detail-update">
                        <span class="update-label">最近更新</span>
                        <span class="update-time" id="lastUpdateTime">${currentNovel.lastUpdate || '2025-04-13 14:30'}</span>
                        <span class="update-badge ${currentNovel.isJustUpdated ? 'badge-hot' : ''}" id="updateBadge">${currentNovel.isJustUpdated ? '刚更新' : ''}</span>
                    </div>
                    <div class="novel-detail-actions">
                        <button type="button" class="btn-primary btn-lg" id="startReadingBtn" data-loading="false">
                            <span class="btn-content">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 1.25rem; height: 1.25rem;">

            // 绑定按钮事件
            document.getElementById('startReadingBtn').addEventListener('click', async function() {

                if (this.dataset.loading === 'true') return;

                setButtonLoading(btn, true);
                
                try {
                    await toggleSubscribe();
                } finally {
                    setButtonLoading(btn, false);
                }
            });

            // 按钮加载状态管理
            function setButtonLoading(btn, loading) {
                btn.dataset.loading = loading ? 'true' : 'false';
                btn.disabled = loading;
                const content = btn.querySelector('.btn-content');
                const spinner = btn.querySelector('.btn-loading');
                
                if (content) content.style.display = loading ? 'none' : 'inline-flex';
                if (spinner) spinner.style.display = loading ? 'inline-flex' : 'none';

        // 渲染简介

        // 渲染章节列表
        function renderChapterList() {
            const list = document.getElementById('chapterList');
            // 按章节序号正序排列（第1章在前）
            const sortedChapters = [...currentChapters].sort((a, b) => {
                // 优先使用 order_index，如果没有则使用 id 或 chapter_number
                const orderA = a.order_index || a.chapter_number || parseInt(a.id) || 0;
                const orderB = b.order_index || b.chapter_number || parseInt(b.id) || 0;
                return orderA - orderB;
            });
            // 取最新的5章显示（按序号倒序取最后5个）
            const displayChapters = sortedChapters.slice(-5).reverse();

            list.innerHTML = displayChapters.map((chapter, index) => {
                const isLocked = chapter.isVip;
                const statusClass = chapter.status === 'published' ? 'badge-success' : 'badge-warning';
                const statusText = chapter.status === 'published' ? '已发布' : '待发布';
                // 判断是否为最新章节（24小时内）
                const chapterDate = new Date(chapter.published_at || chapter.created_at);
                const now = new Date();
                const hoursDiff = (now - chapterDate) / (1000 * 60 * 60);
                const isJustUpdated = hoursDiff < 24 && index === 0;

                return `
                    <div class="chapter-item ${isLocked ? 'chapter-locked' : ''} ${isJustUpdated ? 'chapter-just-updated' : ''}">
                        ${isLocked ? `
                            <span class="chapter-link">
                                <span class="chapter-title">${chapter.title}</span>
                                <span class="chapter-meta">
                                    ${isJustUpdated ? '<span class="chapter-badge badge-hot">刚更新</span>' : ''}
                                    <span class="chapter-status badge-primary">VIP</span>
                                </span>
                            </span>
                        ` : `
                            <a href="../reader/reading.html?novel=${currentNovel.id}&chapter=${chapter.id}" class="chapter-link">
                                <span class="chapter-title">${chapter.title}</span>
                                <span class="chapter-meta">
                                    ${isJustUpdated ? '<span class="chapter-badge badge-hot">刚更新</span>' : ''}
                                    <span class="chapter-status ${statusClass}">${statusText}</span>
                                    <span class="chapter-date">${chapterDate.toLocaleDateString()} ${chapterDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                </span>
                            </a>
                        `}
                    </div>
                `;
            }).join('');

            // 更新查看全部链接
            document.getElementById('viewFullCatalog').href = `catalog.html?novel=${currentNovel.id}`;
            document.getElementById('loadMoreChapters').href = `catalog.html?novel=${currentNovel.id}`;
        }

        // 渲染评论
        function renderComments() {

        // 切换收藏状态
        async function toggleSubscribe() {
            const btn = document.getElementById('subscribeBtn');
            const btnText = document.getElementById('subscribeBtnText');

            // 模拟API调用延迟
            await new Promise(resolve => setTimeout(resolve, 300));

            isFavorite = !isFavorite;

            if (isFavorite) {
                btn.classList.add('active');
                btnText.textContent = '已收藏';
                showToast('已添加到书架', 'success');
            } else {
                btn.classList.remove('active');
                btnText.textContent = '收藏';
                showToast('已取消收藏', 'info');

        // 字符计数更新
        function updateCharCount() {
            const input = document.getElementById('commentInput');
            const charCount = document.getElementById('charCount');
            const length = input.value.length;
            const maxLength = 2000;

            charCount.textContent = `${length}/${maxLength}`;

            // 根据字数更新样式
            charCount.classList.remove('warning', 'error');
            if (length > maxLength * 0.9) {
                charCount.classList.add('error');
            } else if (length > maxLength * 0.8) {
                charCount.classList.add('warning');
            }
            
            // 清除错误提示
            const errorEl = document.getElementById('commentError');
            if (errorEl && input.value.trim()) {
                errorEl.style.display = 'none';
            }
        }

        // 评论验证
        function validateComment(content) {
            const errorEl = document.getElementById('commentError');
            const trimmedContent = content.trim();
            
            if (!trimmedContent) {
                errorEl.textContent = '请输入评论内容';
                errorEl.style.display = 'block';
                return false;
            }
            
            if (trimmedContent.length < 1) {
                errorEl.textContent = '评论内容不能为空';
                errorEl.style.display = 'block';
                return false;
            }
            
            if (trimmedContent.length > 2000) {
                errorEl.textContent = '评论内容不能超过2000字';
                errorEl.style.display = 'block';
                return false;
            }
            
            // 检查是否只包含空白字符
            if (!/\S/.test(trimmedContent)) {
                errorEl.textContent = '请输入有效的评论内容';
                errorEl.style.display = 'block';
                return false;
            }
            
            errorEl.style.display = 'none';
            return true;
        }

        // 发表评论
        async function submitComment(e) {
            if (e) e.preventDefault();
            
            const input = document.getElementById('commentInput');
            const submitBtn = document.getElementById('submitComment');
            const content = input.value;

            // 验证评论
            if (!validateComment(content)) {
                return;
            }

            // 设置按钮加载状态
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.dataset.loading = 'true';
                const btnContent = submitBtn.querySelector('.btn-content');
                const btnLoading = submitBtn.querySelector('.btn-loading');
                if (btnContent) btnContent.style.display = 'none';
                if (btnLoading) btnLoading.style.display = 'inline-flex';
            }

            try {
                // 模拟API调用延迟
                await new Promise(resolve => setTimeout(resolve, 500));

                const trimmedContent = content.trim();

                // 创建新评论
                const newComment = {
                    id: 'new_' + Date.now(),
                    novel_id: currentNovel.id,
                    userName: USER_DATA.nickname,
                    avatar: USER_DATA.avatarUrl,
                    content: trimmedContent,
                    time: '刚刚',
                    likes: 0,
                    isLiked: false,
                    isLocal: true // 标记为本地评论
                };

                // 添加到当前评论列表
                currentComments.unshift(newComment);
                
                // 保存到本地存储
                saveCommentToLocal(newComment);
                
                renderComments();
                input.value = '';
                updateCharCount();
                showToast('评论发表成功', 'success');
                
                // 清除错误提示
                document.getElementById('commentError').style.display = 'none';
            } catch (error) {
                console.error('发表评论错误:', error);
                showToast('评论发表失败，请重试', 'error');
            } finally {
                // 恢复按钮状态
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.dataset.loading = 'false';
                    const btnContent = submitBtn.querySelector('.btn-content');
                    const btnLoading = submitBtn.querySelector('.btn-loading');
                    if (btnContent) btnContent.style.display = 'inline';
                    if (btnLoading) btnLoading.style.display = 'none';
                }
            }
        }
        
        // 保存评论到本地存储
        function saveCommentToLocal(comment) {
            try {
                const storageKey = `novelhub_comments_${currentNovel.id}`;
                let localComments = JSON.parse(localStorage.getItem(storageKey) || '[]');
                localComments.unshift(comment);
                // 限制存储数量
                if (localComments.length > 50) {
                    localComments = localComments.slice(0, 50);
                }
                localStorage.setItem(storageKey, JSON.stringify(localComments));
            } catch (e) {
                console.error('保存评论到本地失败:', e);
            }
        }
        
        // 从本地存储加载评论
        function loadCommentsFromLocal() {
            try {
                const storageKey = `novelhub_comments_${currentNovel.id}`;
                const localComments = JSON.parse(localStorage.getItem(storageKey) || '[]');
                // 合并本地评论和服务器评论，去重
                const existingIds = new Set(currentComments.map(c => c.id));
                localComments.forEach(comment => {
                    if (!existingIds.has(comment.id)) {
                        currentComments.push(comment);
                    }
                });
                // 按时间排序
                currentComments.sort((a, b) => {
                    if (a.time === '刚刚') return -1;
                    if (b.time === '刚刚') return 1;
                    return new Date(b.time) - new Date(a.time);
                });
            } catch (e) {
                console.error('从本地加载评论失败:', e);
            }
        }
        
        // 删除本地评论
        function deleteLocalComment(commentId) {
            try {
                const storageKey = `novelhub_comments_${currentNovel.id}`;
                let localComments = JSON.parse(localStorage.getItem(storageKey) || '[]');
                localComments = localComments.filter(c => c.id !== commentId);
                localStorage.setItem(storageKey, JSON.stringify(localComments));
            } catch (e) {
                console.error('删除本地评论失败:', e);
            }
        }

        // 点赞评论
        window.toggleLike = function(commentId) {
            const comment = currentComments.find(c => c.id === commentId);
            if (comment) {
                comment.isLiked = !comment.isLiked;
                comment.likes += comment.isLiked ? 1 : -1;
                renderComments();
            }
        };

        // 回复评论
        window.replyComment = function(commentId) {
            const comment = currentComments.find(c => c.id === commentId);
            if (comment) {
                const input = document.getElementById('commentInput');
                input.value = `@${comment.userName} `;
                input.focus();
            }
        };

        // 初始化页面
        function initPage() {
            // 从URL获取小说ID（支持 'novel' 和 'id' 两种参数名）
            const urlParams = new URLSearchParams(window.location.search);
            const novelId = urlParams.get('novel') || urlParams.get('id') || NOVELS[0].id;

            // 查找小说数据
            currentNovel = NOVELS.find(n => n.id === novelId) || NOVELS[0];

            // 获取该小说的章节
            currentChapters = CHAPTERS.filter(c => c.novel_id === currentNovel.id).sort((a, b) => a.order_index - b.order_index);

            // 获取该小说的评论
            currentComments = COMMENTS.filter(c => c.novel_id === currentNovel.id);
            
            // 加载本地存储的评论
            loadCommentsFromLocal();

            // 更新页面标题
            document.title = `${currentNovel.title} - ${currentNovel.category} | NovelHub`;

            // 渲染页面
            renderNovelHero();
            renderDescription();
            renderChapterList();
            renderTags();
            renderAuthorInfo();
            renderComments();
            renderRecommendations();

            // 设置用户头像
            const userAvatar = document.getElementById('userAvatar');
            if (userAvatar) {
                userAvatar.src = USER_DATA.avatarUrl;
                userAvatar.alt = USER_DATA.nickname;
            }

            // 绑定评论表单提交事件
            document.getElementById('commentForm').addEventListener('submit', submitComment);
            
            // 绑定评论提交按钮事件
            document.getElementById('submitComment').addEventListener('click', submitComment);

            // 绑定字符计数事件
            document.getElementById('commentInput').addEventListener('input', updateCharCount);
            
            // 绑定回车提交（Ctrl+Enter）
            document.getElementById('commentInput').addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    submitComment();
                }
            });

            // 绑定加载更多评论事件
            document.getElementById('loadMoreComments').addEventListener('click', () => {
                loadMoreComments();
            });

            // 绑定评论筛选事件
            initCommentFilters();

            // 加载更多评论功能
            let displayedComments = 5;
            const commentsPerLoad = 5;

            function loadMoreComments() {
                const commentList = document.getElementById('commentList');
                const loadMoreBtn = document.getElementById('loadMoreComments');
                const btnText = loadMoreBtn.querySelector('.btn-text');
                const btnLoading = loadMoreBtn.querySelector('.btn-loading');

                if (displayedComments >= currentComments.length) {
                    showToast('已加载全部评论', 'info');
                    btnText.textContent = '没有更多评论了';
                    loadMoreBtn.disabled = true;
                    return;
                }

                // 显示加载状态
                btnText.style.display = 'none';
                btnLoading.style.display = 'inline-flex';
                loadMoreBtn.disabled = true;

                // 模拟加载延迟
                setTimeout(() => {
                    const nextBatch = currentComments.slice(displayedComments, displayedComments + commentsPerLoad);
                    displayedComments += nextBatch.length;

                    // 追加新评论
                    const newCommentsHTML = nextBatch.map(comment => `
                        <div class="comment-item" data-id="${comment.id}">
                            <div class="comment-avatar">
                                <img src="${comment.avatar}" alt="${comment.userName}" class="avatar-img">
                            </div>
                            <div class="comment-content">
                                <div class="comment-header">
                                    <span class="comment-author">${comment.userName}</span>
                                    <span class="comment-time">${comment.time}</span>
                                </div>
                                <p class="comment-text">${comment.content}</p>
                                <div class="comment-actions">
                                    <button type="button" class="comment-action ${comment.isLiked ? 'active' : ''}" onclick="toggleLike('${comment.id}')">
                                        <svg viewBox="0 0 24 24" fill="${comment.isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                        </svg>
                                        ${comment.likes}
                                    </button>
                                    <button type="button" class="comment-action" onclick="replyComment('${comment.id}')">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                        </svg>
                                        回复
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    // 将新评论追加到列表
                    commentList.insertAdjacentHTML('beforeend', newCommentsHTML);

                    // 更新按钮状态
                    btnText.style.display = 'inline';
                    btnLoading.style.display = 'none';
                    loadMoreBtn.disabled = false;

                    if (displayedComments >= currentComments.length) {
                        btnText.textContent = '没有更多评论了';
                        loadMoreBtn.disabled = true;
                    }

                    showToast(`已加载 ${nextBatch.length} 条新评论`, 'success');
                }, 500);
            }

            // 隐藏页面加载器
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.classList.add('hidden');
                }
            }, 500);
        }

        // 评论筛选功能
            function initCommentFilters() {
                const filterBar = document.getElementById('commentFilterBar');
                if (!filterBar) return;

                const filterBtns = filterBar.querySelectorAll('.filter-btn');
                
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        // 更新按钮状态
                        filterBtns.forEach(b => {
                            b.classList.remove('active');
                            b.setAttribute('aria-pressed', 'false');
                        });
                        btn.classList.add('active');
                        btn.setAttribute('aria-pressed', 'true');

                        // 获取筛选类型
                        const filterType = btn.dataset.filter;
                        
                        // 重新排序评论
                        sortComments(filterType);
                        
                        // 显示提示
                        const filterNames = { all: '全部', hot: '最热', latest: '最新' };
                        showToast(`已切换到${filterNames[filterType]}评论`, 'info');
                    });
                });
            }

            // 评论排序
            function sortComments(filterType) {
                switch(filterType) {
                    case 'hot':
                        // 按点赞数排序
                        currentComments.sort((a, b) => b.likes - a.likes);
                        break;
                    case 'latest':
                        // 按时间排序（假设ID越大越新）
                        currentComments.sort((a, b) => b.id.localeCompare(a.id));
                        break;
                    case 'all':
                    default:
                        // 默认排序（按ID）
                        currentComments.sort((a, b) => a.id.localeCompare(b.id));
                        break;
                }
                
                // 重置显示计数
                displayedComments = 5;
                
                // 重新渲染评论
                renderComments();
                
                // 重置加载更多按钮
                const loadMoreBtn = document.getElementById('loadMoreComments');
                const btnText = loadMoreBtn.querySelector('.btn-text');
                btnText.textContent = '加载更多评论';
                loadMoreBtn.disabled = false;
            }

            // 页面加载完成后初始化
            document.addEventListener('DOMContentLoaded', () => {
                initData(); // 初始化数据
                initCommon();
                initPage();
            });
        </script>
