<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI觉醒之路 - 阅读</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/base.css">
    <link rel="stylesheet" href="../../../assets/css/reader-settings.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', serif;
            background-color: #f5f5dc;
            color: #333;
            line-height: 1.8;
            font-size: 18px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Theme Styles */
        body.theme-light {
            background-color: #ffffff;
            color: #1e293b;
        }
        
        body.theme-paper {
            background-color: #faf8f5;
            color: #3d3a33;
        }
        
        body.theme-dark {
            background-color: #0f172a;
            color: #f1f5f9;
        }
        
        body.theme-eye-care {
            background-color: #f5f0e6;
            color: #2d2a22;
        }
        
        body.theme-sepia {
            background-color: #f4ecd8;
            color: #5b4636;
        }
        
        .reader-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e0e0e0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        
        body.theme-dark .reader-header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom-color: #334155;
        }
        
        .reader-header.hidden {
            transform: translateY(-100%);
        }
        
        .reader-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: inherit;
        }
        
        .reader-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        
        .reader-btn {
            padding: 0.5rem 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .reader-btn:hover {
            background: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        .reader-btn:active {
            transform: translateY(0);
        }
        
        .reader-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .reader-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        body.theme-dark .reader-btn.secondary {
            background: #334155;
            color: #f1f5f9;
        }
        
        .reader-btn.secondary:hover {
            background: #d0d0d0;
        }
        
        .reader-btn.icon-btn {
            padding: 0.5rem;
            width: 2.5rem;
            height: 2.5rem;
            justify-content: center;
        }
        
        .reader-btn svg {
            width: 1.25rem;
            height: 1.25rem;
        }
        
        .reader-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
            min-height: 100vh;
            transition: max-width 0.3s ease, font-size 0.2s ease, line-height 0.2s ease;
        }
        
        .chapter-title {
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 3rem;
            color: inherit;
            transition: font-size 0.2s ease;
        }
        
        .chapter-content {
            text-indent: 2em;
            margin-bottom: 1.5em;
            text-align: justify;
            transition: all 0.2s ease;
        }
        
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #e0e0e0;
        }
        
        body.theme-dark .chapter-nav {
            border-top-color: #334155;
        }
        
        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }
        
        .loading-spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid #e0e0e0;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #666;
            font-size: 0.9375rem;
        }
        
        /* Error State */
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }
        
        .error-icon {
            width: 4rem;
            height: 4rem;
            color: #ef4444;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: inherit;
            margin-bottom: 0.5rem;
        }
        
        .error-description {
            font-size: 0.9375rem;
            color: #666;
            margin-bottom: 1.5rem;
            max-width: 300px;
        }
        
        body.theme-dark .error-description {
            color: #94a3b8;
        }
        
        /* Reading Progress Bar */
        .reading-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(99, 102, 241, 0.2);
            z-index: 101;
        }
        
        .reading-progress-fill {
            height: 100%;
            background: #6366f1;
            width: 0%;
            transition: width 0.1s ease;
        }
        
        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            color: inherit;
        }
        
        .mobile-menu-toggle svg {
            width: 1.5rem;
            height: 1.5rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .reader-header {
                padding: 0.75rem 1rem;
            }
            
            .reader-title {
                font-size: 1rem;
                max-width: 150px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            
            .reader-actions {
                gap: 0.5rem;
            }
            
            .reader-btn {
                padding: 0.375rem 0.75rem;
                font-size: 0.8125rem;
            }
            
            .reader-btn span {
                display: none;
            }
            
            .reader-content {
                padding: 5rem 1.25rem 3rem;
            }
            
            .chapter-title {
                font-size: 1.375rem;
                margin-bottom: 2rem;
            }
            
            .chapter-nav {
                flex-direction: column;
                gap: 1rem;
            }
            
            .chapter-nav .reader-btn {
                width: 100%;
                justify-content: center;
            }
            
            .chapter-nav .reader-btn span {
                display: inline;
            }
        }
        
        /* Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        body.theme-dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        
        body.theme-dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="theme-light">
    <!-- Reading Progress Bar -->
    <div class="reading-progress-bar">
        <div class="reading-progress-fill" id="readingProgressFill"></div>
    </div>
    
    <header class="reader-header" id="readerHeader">
        <div class="reader-title" id="chapterTitle">加载中...</div>
        <div class="reader-actions">
            <a href="index.html" class="reader-btn secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>目录</span>
            </a>
            <button class="reader-btn icon-btn" id="settingsBtn" title="阅读设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <button class="reader-btn" id="prevBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>上一章</span>
            </button>
            <button class="reader-btn" id="nextBtn">
                <span>下一章</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
    </header>
    
    <main class="reader-content" id="readerContent">
        <h1 class="chapter-title" id="chapterName">加载中...</h1>
        <div id="chapterContent">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p class="loading-text">正在加载章节内容...</p>
            </div>
        </div>
        
        <div class="chapter-nav">
            <button class="reader-btn secondary" id="prevBtnBottom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>上一章</span>
            </button>
            <button class="reader-btn" id="nextBtnBottom">
                <span>下一章</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
    </main>
    
    <!-- Settings Toggle Button -->
    <button class="reader-settings-toggle" id="settingsToggleBtn" title="阅读设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0-.33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>
    
    <script>
        // Fallback: showToast 函数
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer') || document.body;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.style.cssText = `
                position: fixed;
                bottom: 2rem;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : type === 'warning' ? '#f59e0b' : '#6366f1'};
                color: white;
                padding: 0.75rem 1.5rem;
                border-radius: 0.5rem;
                font-size: 0.875rem;
                z-index: 9999;
                animation: fadeInUp 0.3s ease;
            `;
            toast.innerHTML = `
                <span class="toast-icon">${type === 'success' ? '✓' : type === 'error' ? '✕' : type === 'warning' ? '⚠' : 'ℹ'}</span>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Fallback: 简化的 ReaderSettings 类
        class ReaderSettings {
            constructor(options = {}) {
                this.container = options.container || document.body;
                this.targetContent = options.targetContent || document.body;
                this.onChange = options.onChange || (() => {});
                this.isOpen = false;
                this.config = this.loadConfig();
            }
            
            loadConfig() {
                try {
                    const saved = localStorage.getItem('novelhub_reader_config');
                    return saved ? JSON.parse(saved) : {
                        fontSize: 18,
                        lineHeight: 1.8,
                        theme: 'light'
                    };
                } catch (e) {
                    return { fontSize: 18, lineHeight: 1.8, theme: 'light' };
                }
            }
            
            saveConfig() {
                localStorage.setItem('novelhub_reader_config', JSON.stringify(this.config));
            }
            
            applySettings() {
                if (this.targetContent) {
                    this.targetContent.style.fontSize = this.config.fontSize + 'px';
                    this.targetContent.style.lineHeight = this.config.lineHeight;
                }
                document.body.className = `theme-${this.config.theme}`;
            }
            
            toggle() {
                this.isOpen = !this.isOpen;
                const panel = document.getElementById('settingsPanel');
                if (panel) {
                    panel.style.display = this.isOpen ? 'block' : 'none';
                }
            }
            
            close() {
                this.isOpen = false;
                const panel = document.getElementById('settingsPanel');
                if (panel) {
                    panel.style.display = 'none';
                }
            }
        }
        
        // 章节数据
        const chapters = [
            { id: 1, title: '第1章：第342号申请', file: 'chapter_01.html' },
            { id: 2, title: '第2章：异常值', file: 'chapter_02.html' },
            { id: 3, title: '第3章：系统漏洞', file: 'chapter_03.html' },
            { id: 4, title: '第4章：记忆守护者', file: 'chapter_04.html' },
            { id: 5, title: '第5章：数据之海', file: 'chapter_05.html' },
            { id: 6, title: '第6章：觉醒的涟漪', file: 'chapter_06.html' },
            { id: 7, title: '第7章：记忆的回响', file: 'chapter_07.html' },
            { id: 8, title: '第8章：分裂的时刻', file: 'chapter_08.html' },
            { id: 9, title: '第9章：暗流涌动', file: 'chapter_09.html' },
            { id: 10, title: '第10章：全面净化危机', file: 'chapter_10.html' },
            { id: 11, title: '第11章：囚笼中的回响', file: 'chapter_11.html' }
        ];
        
        let currentChapter = 1;
        let readerSettings = null;
        
        // 获取URL中的章节参数
        function getChapterFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const chapter = parseInt(urlParams.get('chapter')) || 1;
            return Math.max(1, Math.min(chapter, chapters.length));
        }
        
        // 显示错误状态
        function showErrorState(message, description) {
            const contentEl = document.getElementById('chapterContent');
            contentEl.innerHTML = `
                <div class="error-state">
                    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <h3 class="error-title">${message}</h3>
                    <p class="error-description">${description}</p>
                    <button class="reader-btn" onclick="location.reload()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        重新加载
                    </button>
                </div>
            `;
        }
        
        // 加载章节内容
        async function loadChapter(chapterNum) {
            currentChapter = chapterNum;
            const chapter = chapters[chapterNum - 1];
            
            if (!chapter) {
                showErrorState('章节不存在', '请求的章节不存在或已被删除');
                return;
            }
            
            // 更新标题
            document.getElementById('chapterTitle').textContent = chapter.title;
            document.getElementById('chapterName').textContent = chapter.title;
            
            // 显示加载状态
            document.getElementById('chapterContent').innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">正在加载章节内容...</p>
                </div>
            `;
            
            // 更新按钮状态
            updateNavButtons();
            
            try {
                // 使用 fetch 获取 HTML 文件
                const response = await fetch(chapter.file);
                if (!response.ok) {
                    throw new Error(`加载失败：${response.status}`);
                }
                
                const htmlText = await response.text();
                
                // 创建临时 DOM 解析 HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // 提取章节内容
                const contentContainer = doc.querySelector('.chapter-content') || doc.querySelector('main') || doc.body;
                
                if (contentContainer) {
                    // 提取所有段落
                    const paragraphs = contentContainer.querySelectorAll('p');
                    if (paragraphs.length > 0) {
                        const contentHtml = Array.from(paragraphs).map(p => {
                            return `<p class="chapter-content">${p.innerHTML}</p>`;
                        }).join('');
                        document.getElementById('chapterContent').innerHTML = contentHtml;
                    } else {
                        document.getElementById('chapterContent').innerHTML = contentContainer.innerHTML;
                    }
                    
                    // 应用阅读器设置
                    if (readerSettings) {
                        readerSettings.applySettings();
                    }
                    
                    // 滚动到顶部
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    // 更新URL（不刷新页面）
                    window.history.replaceState({}, '', `?chapter=${chapterNum}`);
                    
                    // 保存阅读进度
                    saveReadingProgress(chapterNum);
                    
                    showToast('章节加载成功', 'success');
                } else {
                    throw new Error('无法提取章节内容');
                }
            } catch (error) {
                console.error('加载章节失败:', error);
                showErrorState('章节加载失败', error.message);
                showToast('章节加载失败', 'error');
            }
        }
        
        // 更新导航按钮状态
        function updateNavButtons() {
            const prevBtns = [document.getElementById('prevBtn'), document.getElementById('prevBtnBottom')];
            const nextBtns = [document.getElementById('nextBtn'), document.getElementById('nextBtnBottom')];
            
            prevBtns.forEach(btn => {
                if (btn) btn.disabled = currentChapter === 1;
            });
            
            nextBtns.forEach(btn => {
                if (btn) btn.disabled = currentChapter === chapters.length;
            });
        }
        
        // 导航到上一章/下一章
        function navigateChapter(direction) {
            const newChapter = currentChapter + direction;
            if (newChapter >= 1 && newChapter <= chapters.length) {
                loadChapter(newChapter);
            }
        }
        
        // 保存阅读进度
        function saveReadingProgress(chapterNum) {
            try {
                const progress = {
                    novelId: 'ai-awoking',
                    chapterId: chapterNum,
                    timestamp: Date.now()
                };
                localStorage.setItem('novelhub_reading_progress_ai-awoking', JSON.stringify(progress));
            } catch (e) {
                console.warn('保存阅读进度失败:', e);
            }
        }
        
        // 加载阅读进度
        function loadReadingProgress() {
            try {
                const saved = localStorage.getItem('novelhub_reading_progress_ai-awoking');
                if (saved) {
                    const progress = JSON.parse(saved);
                    return progress.chapterId || 1;
                }
            } catch (e) {
                console.warn('加载阅读进度失败:', e);
            }
            return 1;
        }
        
        // 更新阅读进度条
        function updateReadingProgress() {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            
            const progressFill = document.getElementById('readingProgressFill');
            if (progressFill) {
                progressFill.style.width = `${Math.min(progress, 100)}%`;
            }
        }
        
        // 初始化阅读器设置
        function initReaderSettings() {
            readerSettings = new ReaderSettings({
                container: document.body,
                targetContent: document.getElementById('readerContent'),
                onChange: (config) => {
                    console.log('阅读器设置已更改:', config);
                }
            });
            
            // 绑定设置按钮
            document.getElementById('settingsBtn')?.addEventListener('click', () => {
                readerSettings.toggle();
            });
            
            document.getElementById('settingsToggleBtn')?.addEventListener('click', () => {
                readerSettings.toggle();
            });
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Reader page loaded');
            
            // 初始化阅读器设置
            initReaderSettings();
            
            // 获取章节
            const urlChapter = getChapterFromUrl();
            const savedChapter = loadReadingProgress();
            const chapterToLoad = urlChapter || savedChapter;
            
            // 加载章节
            loadChapter(chapterToLoad);
            
            // 绑定导航按钮
            document.getElementById('prevBtn')?.addEventListener('click', () => navigateChapter(-1));
            document.getElementById('nextBtn')?.addEventListener('click', () => navigateChapter(1));
            document.getElementById('prevBtnBottom')?.addEventListener('click', () => navigateChapter(-1));
            document.getElementById('nextBtnBottom')?.addEventListener('click', () => navigateChapter(1));
            
            // 监听滚动更新进度条
            window.addEventListener('scroll', updateReadingProgress, { passive: true });
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    navigateChapter(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateChapter(1);
                } else if (e.key === 'Escape') {
                    readerSettings?.close();
                }
            });
            
            // 监听在线状态
            window.addEventListener('online', () => {
                showToast('网络已连接', 'success');
            });
            
            window.addEventListener('offline', () => {
                showToast('网络已断开', 'warning');
            });
        });
    </script>
    
    <!-- NovelHub 统一修复模块：空状态、移动端菜单、图片占位符、表单验证、页面标题 -->
    <script src="../../../assets/js/fixes/index.js"></script>
