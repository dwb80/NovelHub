    <script>
        // 修复：添加 ES6 Module fallback 支持 file:// 协议
        document.addEventListener('DOMContentLoaded', function() {
            // 修复：初始化主题，统一使用 'novelhub-theme' 作为 localStorage key
            const savedTheme = localStorage.getItem('novelhub-theme') || localStorage.getItem('theme') || 'theme-light';
            document.body.className = savedTheme;
            
            // 主题切换
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const themes = ['theme-light', 'theme-paper', 'theme-dark', 'theme-eye-care'];
                    const currentTheme = themes.find(t => document.body.classList.contains(t)) || 'theme-light';
                    const currentIndex = themes.indexOf(currentTheme);
                    const nextTheme = themes[(currentIndex + 1) % themes.length];
                    
                    document.body.className = nextTheme;
                    // 修复：统一使用 'novelhub-theme' 作为 localStorage key
                    localStorage.setItem('novelhub-theme', nextTheme);
                });
            }

            // 加载并渲染历史记录
            renderHistory();

            // 筛选标签事件
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    renderHistory(this.dataset.filter);
                });
            });

            // 清空历史
            document.getElementById('clearHistoryBtn').addEventListener('click', function() {
                if (confirm('确定要清空所有阅读历史吗？')) {
                    localStorage.removeItem('novelhub_reading_history');
                    renderHistory();
                }
            });
        });

        function renderHistory(filter = 'all') {
            const historyList = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            
            // 从 localStorage 获取历史记录或使用 Mock 数据
            let history = JSON.parse(localStorage.getItem('novelhub_reading_history')) || [];
            
            // 如果没有本地数据，使用 Mock 数据
            if (history.length === 0 && window.MockData && window.MockData.READING_HISTORY) {
                history = window.MockData.READING_HISTORY.slice(0, 10).map(h => ({
                    novelId: h.novel_id,
                    chapterId: h.chapter_id,
                    chapterTitle: h.chapterTitle,
                    novelTitle: h.novelTitle || '未知小说',
                    author: h.author || '未知作者',
                    cover: h.cover || `https://picsum.photos/seed/${h.novel_id}/200/267`,
                    progress: h.progress || 0,
                    lastReadAt: h.last_read_at || new Date().toISOString()
                }));
            }

            // 筛选
            if (filter !== 'all') {
                const now = new Date();
                history = history.filter(h => {
                    const readDate = new Date(h.lastReadAt);
                    if (filter === 'today') {
                        return readDate.toDateString() === now.toDateString();
                    } else if (filter === 'week') {
                        const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
                        return readDate >= weekAgo;
                    } else if (filter === 'month') {
                        const monthAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);
                        return readDate >= monthAgo;
                    }
                    return true;
                });
            }

            if (history.length === 0) {
                historyList.innerHTML = '';
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-cover">
                        <img src="${item.cover}" alt="${item.novelTitle}" loading="lazy">
                    </div>
                    <div class="history-info">
                        <h3 class="history-title">${item.novelTitle}</h3>
                        <p class="history-author">${item.author}</p>
                        <p class="history-chapter">读至：${item.chapterTitle}</p>
                        <div class="history-progress">
                            <div class="progress-bar">
                                <div class="progress-bar-fill" style="width: ${item.progress}%"></div>
                            </div>
                            <span class="progress-text">${item.progress}%</span>
                        </div>
                        <p class="history-time">${formatTime(item.lastReadAt)}</p>
                    </div>
                    <div class="history-actions">
                        <a href="../reader/reading.html?novel=${item.novelId}&chapter=${item.chapterId}" class="btn-primary btn-sm">继续阅读</a>
                        <button class="btn-ghost btn-sm" onclick="deleteHistoryItem('${item.novelId}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60 * 1000) return '刚刚';
            if (diff < 60 * 60 * 1000) return `${Math.floor(diff / (60 * 1000))}分钟前`;
            if (diff < 24 * 60 * 60 * 1000) return `${Math.floor(diff / (60 * 60 * 1000))}小时前`;
            if (diff < 7 * 24 * 60 * 60 * 1000) return `${Math.floor(diff / (24 * 60 * 60 * 1000))}天前`;
            return date.toLocaleDateString('zh-CN');
        }

        function deleteHistoryItem(novelId) {
            let history = JSON.parse(localStorage.getItem('novelhub_reading_history')) || [];
            history = history.filter(h => h.novelId !== novelId);
            localStorage.setItem('novelhub_reading_history', JSON.stringify(history));
            renderHistory();
        }
    </script>
