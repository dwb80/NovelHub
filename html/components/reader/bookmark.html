<script>
(function() {
    'use strict';
    
    window.Bookmark = {
        panel: null,
        overlay: null,
        bookmarks: [],
        currentChapterId: null,
        currentChapterTitle: '',
        currentProgress: 0,
        bookId: null,
        
        init: function(options) {
            this.panel = document.getElementById('bookmarkPanel');
            this.bookId = options?.bookId;
            
            // 创建遮罩层
            this.overlay = document.createElement('div');
            this.overlay.className = 'bookmark-overlay';
            document.body.appendChild(this.overlay);
            
            this.loadBookmarks();
            this.bindEvents();
            this.render();
        },
        
        bindEvents: function() {
            // 关闭按钮
            document.getElementById('bookmarkClose')?.addEventListener('click', () => this.hide());
            
            // 添加书签按钮
            document.getElementById('bookmarkAddBtn')?.addEventListener('click', () => this.showAddModal());
            
            // 书签切换按钮（工具栏）
            document.getElementById('bookmarkToggleBtn')?.addEventListener('click', () => this.toggleBookmark());
            
            // 弹窗事件
            document.getElementById('bookmarkModalClose')?.addEventListener('click', () => this.hideAddModal());
            document.getElementById('bookmarkModalCancel')?.addEventListener('click', () => this.hideAddModal());
            document.getElementById('bookmarkModalSave')?.addEventListener('click', () => this.saveBookmark());
            document.getElementById('bookmarkModalOverlay')?.addEventListener('click', () => this.hideAddModal());
            
            // 点击遮罩关闭
            this.overlay?.addEventListener('click', () => this.hide());
            
            // ESC键关闭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (document.getElementById('bookmarkModal')?.style.display !== 'none') {
                        this.hideAddModal();
                    } else if (this.isVisible()) {
                        this.hide();
                    }
                }
            });
        },
        
        show: function() {
            this.panel?.classList.add('active');
            this.overlay?.classList.add('active');
            document.body.style.overflow = 'hidden';
        },
        
        hide: function() {
            this.panel?.classList.remove('active');
            this.overlay?.classList.remove('active');
            document.body.style.overflow = '';
        },
        
        isVisible: function() {
            return this.panel?.classList.contains('active');
        },
        
        toggle: function() {
            if (this.isVisible()) {
                this.hide();
            } else {
                this.show();
            }
        },
        
        // 设置当前阅读位置
        setCurrentPosition: function(chapterId, chapterTitle, progress) {
            this.currentChapterId = chapterId;
            this.currentChapterTitle = chapterTitle;
            this.currentProgress = progress;
            
            this.updateToggleButton();
        },
        
        // 更新切换按钮状态
        updateToggleButton: function() {
            const btn = document.getElementById('bookmarkToggleBtn');
            if (!btn) return;
            
            const hasBookmark = this.bookmarks.some(b => b.chapterId === this.currentChapterId);
            btn.classList.toggle('active', hasBookmark);
            btn.title = hasBookmark ? '移除书签' : '添加书签';
        },
        
        // 切换书签（添加/移除）
        toggleBookmark: function() {
            const existingIndex = this.bookmarks.findIndex(b => b.chapterId === this.currentChapterId);
            
            if (existingIndex >= 0) {
                // 移除书签
                this.removeBookmark(this.bookmarks[existingIndex].id);
                if (window.Toast) {
                    Toast.success('书签已移除');
                }
            } else {
                // 显示添加弹窗
                this.showAddModal();
            }
        },
        
        // 显示添加弹窗
        showAddModal: function() {
            if (!this.currentChapterId) {
                if (window.Toast) {
                    Toast.error('请先选择章节');
                }
                return;
            }
            
            document.getElementById('bookmarkChapterTitle').value = this.currentChapterTitle;
            document.getElementById('bookmarkProgress').value = this.currentProgress + '%';
            document.getElementById('bookmarkNote').value = '';
            
            document.getElementById('bookmarkModalOverlay').style.display = 'block';
            document.getElementById('bookmarkModal').style.display = 'block';
        },
        
        // 隐藏添加弹窗
        hideAddModal: function() {
            document.getElementById('bookmarkModalOverlay').style.display = 'none';
            document.getElementById('bookmarkModal').style.display = 'none';
        },
        
        // 保存书签
        saveBookmark: function() {
            const note = document.getElementById('bookmarkNote').value.trim();
            
            const bookmark = {
                id: Date.now(),
                bookId: this.bookId,
                chapterId: this.currentChapterId,
                chapterTitle: this.currentChapterTitle,
                progress: this.currentProgress,
                note: note,
                createTime: new Date().toISOString()
            };
            
            this.bookmarks.unshift(bookmark);
            this.saveBookmarks();
            this.render();
            this.updateToggleButton();
            this.hideAddModal();
            
            if (window.Toast) {
                Toast.success('书签添加成功');
            }
            
            // 触发事件
            window.dispatchEvent(new CustomEvent('bookmarkAdd', { detail: bookmark }));
        },
        
        // 移除书签
        removeBookmark: function(bookmarkId) {
            const index = this.bookmarks.findIndex(b => b.id === bookmarkId);
            if (index >= 0) {
                const bookmark = this.bookmarks[index];
                this.bookmarks.splice(index, 1);
                this.saveBookmarks();
                this.render();
                this.updateToggleButton();
                
                // 触发事件
                window.dispatchEvent(new CustomEvent('bookmarkRemove', { detail: bookmark }));
            }
        },
        
        // 跳转到书签
        goToBookmark: function(bookmark) {
            window.dispatchEvent(new CustomEvent('bookmarkClick', { detail: bookmark }));
            this.hide();
        },
        
        // 渲染书签列表
        render: function() {
            const listEl = document.getElementById('bookmarkList');
            const emptyEl = document.getElementById('bookmarkEmpty');
            
            if (this.bookmarks.length === 0) {
                listEl.innerHTML = '';
                emptyEl.style.display = 'flex';
                return;
            }
            
            emptyEl.style.display = 'none';
            
            listEl.innerHTML = this.bookmarks.map(bookmark => {
                const time = this.formatTime(bookmark.createTime);
                return `
                    <li class="bookmark-item" data-bookmark-id="${bookmark.id}">
                        <div class="bookmark-item-header">
                            <svg class="bookmark-item-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                            </svg>
                            <div class="bookmark-item-content">
                                <div class="bookmark-item-chapter">${bookmark.chapterTitle}</div>
                                ${bookmark.note ? `<div class="bookmark-item-note">${bookmark.note}</div>` : ''}
                            </div>
                        </div>
                        <div class="bookmark-item-meta">
                            <span class="bookmark-item-progress">${bookmark.progress}%</span>
                            <span class="bookmark-item-time">${time}</span>
                        </div>
                        <button class="bookmark-item-delete" data-bookmark-id="${bookmark.id}" title="删除书签">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                        </button>
                    </li>
                `;
            }).join('');
            
            // 绑定点击事件
            listEl.querySelectorAll('.bookmark-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.bookmark-item-delete')) return;
                    
                    const bookmarkId = parseInt(item.dataset.bookmarkId);
                    const bookmark = this.bookmarks.find(b => b.id === bookmarkId);
                    if (bookmark) {
                        this.goToBookmark(bookmark);
                    }
                });
            });
            
            // 绑定删除事件
            listEl.querySelectorAll('.bookmark-item-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const bookmarkId = parseInt(btn.dataset.bookmarkId);
                    if (window.Modal) {
                        Modal.confirm('确定要删除这个书签吗？', () => {
                            this.removeBookmark(bookmarkId);
                        });
                    } else {
                        this.removeBookmark(bookmarkId);
                    }
                });
            });
        },
        
        // 格式化时间
        formatTime: function(timeStr) {
            const date = new Date(timeStr);
            const now = new Date();
            const diff = now - date;
            
            // 小于1小时
            if (diff < 3600000) {
                const minutes = Math.floor(diff / 60000);
                return minutes < 1 ? '刚刚' : `${minutes}分钟前`;
            }
            // 小于24小时
            if (diff < 86400000) {
                const hours = Math.floor(diff / 3600000);
                return `${hours}小时前`;
            }
            // 小于7天
            if (diff < 604800000) {
                const days = Math.floor(diff / 86400000);
                return `${days}天前`;
            }
            
            return date.toLocaleDateString('zh-CN');
        },
        
        // 从localStorage加载
        loadBookmarks: function() {
            try {
                const key = `bookmarks_${this.bookId || 'default'}`;
                const saved = localStorage.getItem(key);
                if (saved) {
                    this.bookmarks = JSON.parse(saved);
                }
            } catch (e) {
                console.error('加载书签失败:', e);
                this.bookmarks = [];
            }
        },
        
        // 保存到localStorage
        saveBookmarks: function() {
            try {
                const key = `bookmarks_${this.bookId || 'default'}`;
                localStorage.setItem(key, JSON.stringify(this.bookmarks));
            } catch (e) {
                console.error('保存书签失败:', e);
            }
        },
        
        // 获取所有书签
        getBookmarks: function() {
            return this.bookmarks;
        },
        
        // 清空书签
        clearAll: function() {
            if (window.Modal) {
                Modal.confirm('确定要清空所有书签吗？', () => {
                    this.bookmarks = [];
                    this.saveBookmarks();
                    this.render();
                    this.updateToggleButton();
                });
            }
        }
    };
})();
</script>
