<!-- Toast 提示组件 -->
<div class="toast-container" id="toastContainer"></div>

<style>
.toast-container {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: var(--z-toast, 9999);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    pointer-events: none;
}

.toast {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    background: var(--color-bg-elevated);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    border-left: 4px solid;
    min-width: 280px;
    max-width: 400px;
    pointer-events: auto;
    animation: toastSlideIn 0.3s ease;
}

.toast.toast-success {
    border-left-color: var(--color-success);
}

.toast.toast-error {
    border-left-color: var(--color-error);
}

.toast.toast-warning {
    border-left-color: var(--color-warning);
}

.toast.toast-info {
    border-left-color: var(--color-info);
}

.toast-icon {
    width: 1.5rem;
    height: 1.5rem;
    flex-shrink: 0;
}

.toast-success .toast-icon {
    color: var(--color-success);
}

.toast-error .toast-icon {
    color: var(--color-error);
}

.toast-warning .toast-icon {
    color: var(--color-warning);
}

.toast-info .toast-icon {
    color: var(--color-info);
}

.toast-content {
    flex: 1;
}

.toast-title {
    font-weight: 600;
    font-size: 0.9375rem;
    color: var(--color-text-primary);
    margin-bottom: 0.25rem;
}

.toast-message {
    font-size: 0.875rem;
    color: var(--color-text-secondary);
}

.toast-close {
    width: 1.5rem;
    height: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--color-text-muted);
    cursor: pointer;
    border-radius: var(--radius-md);
    transition: all 0.2s;
}

.toast-close:hover {
    background: var(--color-bg-secondary);
    color: var(--color-text-primary);
}

.toast-close svg {
    width: 1rem;
    height: 1rem;
}

@keyframes toastSlideIn {
    from {
        opacity: 0;
        transform: translateX(100%);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes toastSlideOut {
    from {
        opacity: 1;
        transform: translateX(0);
    }
    to {
        opacity: 0;
        transform: translateX(100%);
    }
}

.toast.hiding {
    animation: toastSlideOut 0.3s ease forwards;
}

/* 移动端适配 */
@media (max-width: 640px) {
    .toast-container {
        left: 1rem;
        right: 1rem;
        top: auto;
        bottom: 1rem;
    }
    
    .toast {
        min-width: auto;
        max-width: none;
    }
}
</style>

<script>
(function() {
    'use strict';
    
    window.Toast = {
        container: null,
        
        init: function() {
            this.container = document.getElementById('toastContainer');
            if (!this.container) {
                this.container = document.createElement('div');
                this.container.id = 'toastContainer';
                this.container.className = 'toast-container';
                document.body.appendChild(this.container);
            }
        },
        
        show: function(options) {
            this.init();
            
            const config = Object.assign({
                type: 'info',
                title: '',
                message: '',
                duration: 3000,
                closable: true
            }, options);
            
            const toast = document.createElement('div');
            toast.className = `toast toast-${config.type}`;
            
            const icons = {
                success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            };
            
            toast.innerHTML = `
                <div class="toast-icon">${icons[config.type]}</div>
                <div class="toast-content">
                    ${config.title ? `<div class="toast-title">${config.title}</div>` : ''}
                    <div class="toast-message">${config.message}</div>
                </div>
                ${config.closable ? `<button class="toast-close" onclick="Toast.hide(this.parentElement)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
            `;
            
            this.container.appendChild(toast);
            
            if (config.duration > 0) {
                setTimeout(() => this.hide(toast), config.duration);
            }
            
            return toast;
        },
        
        success: function(message, title) {
            return this.show({ type: 'success', message, title });
        },
        
        error: function(message, title) {
            return this.show({ type: 'error', message, title, duration: 5000 });
        },
        
        warning: function(message, title) {
            return this.show({ type: 'warning', message, title });
        },
        
        info: function(message, title) {
            return this.show({ type: 'info', message, title });
        },
        
        hide: function(toast) {
            if (!toast) return;
            toast.classList.add('hiding');
            setTimeout(() => toast.remove(), 300);
        }
    };
})();
</script>
