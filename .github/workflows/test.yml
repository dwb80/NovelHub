name: NovelHub Test Suite

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2点运行全量测试
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  TEST_BASE_URL: 'http://localhost:8080'

jobs:
  # 代码质量检查
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript check
        run: npx tsc --noEmit

  # 集成测试
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      # 如果需要数据库服务
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run integration tests with coverage
        run: npm run test:integration:coverage
        env:
          CI: true
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: integration
          name: integration-coverage

  # E2E测试
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Start test server
        run: |
          npm run serve &
          npx wait-on $TEST_BASE_URL --timeout 60000
      
      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          TEST_BASE_URL: ${{ env.TEST_BASE_URL }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # 生成测试报告
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests]
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate combined report
        run: |
          mkdir -p combined-report
          
          # 合并覆盖率报告
          if [ -d "artifacts/coverage" ]; then
            cp -r artifacts/coverage combined-report/
          fi
          
          # 合并Playwright报告
          for dir in artifacts/playwright-report-*; do
            if [ -d "$dir" ]; then
              browser=$(basename "$dir" | sed 's/playwright-report-//')
              mkdir -p "combined-report/playwright/$browser"
              cp -r "$dir"/* "combined-report/playwright/$browser/"
            fi
          done
          
          # 生成测试摘要
          cat > combined-report/summary.md << EOF
          # NovelHub 测试报告
          
          ## 执行时间
          $(date)
          
          ## 测试环境
          - Node.js: ${{ env.NODE_VERSION }}
          - 分支: ${{ github.ref }}
          - Commit: ${{ github.sha }}
          
          ## 测试类型
          - 集成测试: ${{ needs.integration-tests.result }}
          - E2E测试 (Chromium): ${{ needs.e2e-tests.result }}
          
          ## 报告位置
          - 集成测试覆盖率: combined-report/coverage/
          - E2E测试报告: combined-report/playwright/
          EOF
      
      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-report
          path: combined-report/
          retention-days: 30

  # 通知
  notify:
    name: Notify Test Results
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.integration-tests.result }}" == "failure" ] || [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "::error::测试失败，请检查测试报告"
            exit 1
          else
            echo "::notice::所有测试通过"
          fi
